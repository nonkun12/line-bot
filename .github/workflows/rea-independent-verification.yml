name: REA Independent Verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "line-dev/**"
      - "rea-candidate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-independent-verification-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install pytest

      - name: Verify commit identity and whitespace
        id: identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_BRANCH: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$HEAD_BRANCH" == rea-candidate/* ]]; then
            # Candidate publication creates a single isolated commit on top of
            # the approved base. github.event.before is the all-zero SHA for a
            # newly created branch, so bind the receipt to the actual parent.
            base_sha="$(git rev-parse "$actual^")"
          else
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if ! [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
            echo "::error::Unable to establish a trustworthy base commit."
            exit 1
          fi
          echo "verified_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          git diff --check "$base_sha...$actual"

      - name: Run repository test suite
        id: tests
        run: python -m pytest -q

      - name: Run deterministic REA diff scan
        id: rea
        env:
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          TARGET_SHA: ${{ steps.identity.outputs.verified_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.rea_readonly_scanner import scan_commit_diff

          report = scan_commit_diff(
              ".",
              base_sha=os.environ["BASE_SHA"],
              target_sha=os.environ["TARGET_SHA"],
          )
          if report.get("complete") is not True:
              raise SystemExit("REA_DIFF_SCAN=BLOCKED")
          severities = [item.get("severity") for item in report.get("findings", [])]
          if any(value == "CRITICAL" for value in severities):
              risk = "CRITICAL"
          elif any(value == "HIGH" for value in severities):
              risk = "HIGH"
          elif any(value == "MEDIUM" for value in severities):
              risk = "MEDIUM"
          else:
              risk = "LOW"
          report["risk"] = risk
          Path("rea-diff-scan.json").write_text(
              json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"risk={risk}\\n")
              fh.write(f"finding_count={report.get('findings_count', 0)}\\n")
              fh.write(f"diff_sha256={report.get('diff_sha256', '')}\\n")
          print(json.dumps({"status": report.get("status"), "risk": risk, "findings_count": report.get("findings_count")}, sort_keys=True))
          if risk in {"HIGH", "CRITICAL"}:
              raise SystemExit("REA_DIFF_SCAN=BLOCKED")
          PY

      - name: Write SHA-bound verification receipt
        if: always()
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ steps.identity.outputs.base_sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          REA_RISK: ${{ steps.rea.outputs.risk || 'UNKNOWN' }}
          REA_FINDING_COUNT: ${{ steps.rea.outputs.finding_count || '0' }}
          REA_DIFF_SHA256: ${{ steps.rea.outputs.diff_sha256 || '' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = {
              "schema_version": 1,
              "run_id": int(os.environ["RUN_ID"]),
              "verified_sha": os.environ["EXPECTED_SHA"],
              "base_sha": os.environ["BASE_SHA"],
              "test_outcome": os.environ.get("TEST_OUTCOME", "unknown").upper(),
              "identity_outcome": os.environ.get("IDENTITY_OUTCOME", "unknown").upper(),
              "risk": os.environ.get("REA_RISK", "UNKNOWN"),
              "rea_finding_count": int(os.environ.get("REA_FINDING_COUNT", "0")),
              "rea_diff_sha256": os.environ.get("REA_DIFF_SHA256", ""),
              "risk_basis": "deterministic_read_only_commit_diff_scan",
              "execution_authorized": False,
              "patch_authorized": False,
              "hold_clear_authorized": False,
              "merge_deploy_authorized": False,
          }
          Path("rea-independent-verification.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-independent-verification-${{ github.run_id }}
          path: |
            rea-independent-verification.json
            rea-diff-scan.json
          if-no-files-found: error
          retention-days: 30
