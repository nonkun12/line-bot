name: LINE Development

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "Explicit development instruction from LINE"
        required: true
        type: string
      user_id:
        description: "LINE user ID"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: line-development-${{ github.event.inputs.user_id }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run guarded LINE development worker v2
        id: development
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.DEV_PR_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/line_development_worker_v2.py

      - name: Notify LINE of development result
        if: always()
        env:
          INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEVELOPMENT_OUTCOME: ${{ steps.development.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/notify_line.py <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get("INTERNAL_PUSH_KEY", "")
          if not key:
              print("INTERNAL_PUSH_KEY is not configured; skipping LINE notification.")
              raise SystemExit(0)

          outcome = os.environ.get("DEVELOPMENT_OUTCOME", "unknown")
          instruction = os.environ.get("DEV_INSTRUCTION", "")
          run_url = os.environ.get("RUN_URL", "")

          if outcome == "success":
              message = (
                  "✅ 自動開発が完了しました。\n"
                  f"指示: {instruction}\n"
                  "テスト・開発処理が完了し、結果をGitHubに反映しました。\n"
                  f"実行結果: {run_url}"
              )
          else:
              message = (
                  "❌ 自動開発が失敗しました。\n"
                  f"指示: {instruction}\n"
                  f"失敗地点: GitHub Actions（{outcome}）\n"
                  f"詳細: {run_url}"
              )

          payload = json.dumps({
              "user_id": os.environ["DEV_USER_ID"],
              "message": message,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://line-bot-yvea.onrender.com/internal/push",
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "x-internal-key": key,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read().decode("utf-8", errors="replace")
                  print(f"LINE notification HTTP {response.status}: {body}")
          except Exception as exc:
              print(f"LINE notification failed but development result is preserved: {type(exc).__name__}: {exc}")
          PY
          python /tmp/notify_line.py

      - name: Upload development log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: line-development-log-${{ github.run_id }}
          path: |
            *.log
            pytest*.txt
          if-no-files-found: ignore
