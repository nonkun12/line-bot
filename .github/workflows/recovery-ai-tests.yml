name: Recovery AI Tests

on:
  pull_request:
    branches:
      - fix/loop-task-health-safety
      - feat/recovery-ai-loop-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-ai-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run Recovery AI focused tests
        run: python -m pytest -q tests/test_recovery_ai.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -m pytest -q
