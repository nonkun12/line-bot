name: English core-image automatic reviewed batches

on:
  schedule:
    # 08:15 JST daily; GitHub Actions schedules are UTC.
    - cron: "15 23 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Reviewed entries to propose (1-25)"
        required: false
        default: "20"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: english-core-image-auto-batch
  cancel-in-progress: false

jobs:
  propose-reviewed-batch:
    if: github.repository == 'nonkun12/line-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest langgraph==1.2.10 langchain-groq groq python-dotenv
      - name: Add next reviewed batch
        env:
          BATCH_SIZE: ${{ inputs.batch_size || '20' }}
        run: |
          python -m json.tool agents/english/core_image_candidates.json > /dev/null
          python scripts/english_core_image_auto_batch.py --batch-size "$BATCH_SIZE"
          git diff --check
          python -m pytest -q tests/test_english_core_image.py
      - name: Open or update review PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/english-core-image-reviewed-batch
          delete-branch: false
          add-paths: |
            agents/english/core_image.py
          commit-message: "feat(english): add next reviewed core-image vocabulary batch"
          title: "feat(english): next reviewed core-image vocabulary batch"
          body: |
            ## Summary
            - Add the next batch from the repository's reviewed local candidate queue.
            - Skip words already present in the dictionary and reject malformed/duplicate candidates.
            - Install the focused test runner explicitly, then run regression tests before proposing changes.

            ## Safety
            - No network calls, external/paid APIs, guessed etymologies, auto-merge, or deployment.
            - This is a human-review PR; CI must pass before any merge.
            - The workflow only uses reviewed candidates already committed to the repository.
          labels: |
            english
            automation
