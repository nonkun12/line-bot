name: Side Chat Contract

on:
  push:
    branches:
      - '**'
    paths:
      - 'core/side_chat_store.py'
      - 'tests/test_side_chat_store.py'
      - '.github/workflows/side-chat-contract.yml'
  pull_request:
    paths:
      - 'core/side_chat_store.py'
      - 'tests/test_side_chat_store.py'
      - '.github/workflows/side-chat-contract.yml'

permissions:
  contents: read

jobs:
  side-chat-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run isolated side-chat contract tests
        run: python -m pytest -q tests/test_side_chat_store.py
