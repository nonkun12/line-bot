name: Worker Step Test

on:
  push:
    branches:
      - ai-clone-agent-step-worker

jobs:
  worker-step-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Worker graph and lifecycle tests
        run: |
          pytest -q \
            standalone-agent/tests/test_worker_graph_controls.py \
            standalone-agent/tests/test_worker_graph_sqlite.py \
            tests/test_job_worker.py \
            tests/test_job_lease.py
