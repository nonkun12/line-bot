name: Nightly Development Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run safe smoke test
        run: python scripts/nightly_development_test.py
