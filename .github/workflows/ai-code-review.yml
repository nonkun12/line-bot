name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          git fetch origin main
          git diff origin/main...HEAD > diff.txt

      - name: Show diff
        run: |
          cat diff.txt