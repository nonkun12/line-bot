name: AI Code Review

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin main

      - name: Validate review diff
        run: |
          test -n "$(git diff origin/main...HEAD)"
          echo "Review diff is available for the Worker AI review gate." >> "$GITHUB_STEP_SUMMARY"
