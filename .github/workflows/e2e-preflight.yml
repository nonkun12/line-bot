name: E2E Preflight

on:
  push:
    branches: [main]
    paths:
      - "tests/test_line_development.py"
      - "line_development.py"
      - ".github/workflows/e2e-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Full pytest
        run: python -m pytest -q --tb=native
