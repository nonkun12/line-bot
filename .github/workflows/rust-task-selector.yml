name: Rust Task Selector

on:
  pull_request:
    paths:
      - "rust/task-selector/**"
      - "scripts/autonomous_task_refill.py"
      - "tests/test_autonomous_task_refill.py"
      - "tests/test_rust_task_selector_shadow.py"
      - "tests/benchmark_rust_task_selector.py"
      - ".github/workflows/rust-task-selector.yml"
  push:
    branches:
      - feat/rust-task-selector-shadow-20261114
    paths:
      - "rust/task-selector/**"
      - ".github/workflows/rust-task-selector.yml"

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install stable Rust toolchain
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            echo "::error::rustup is unavailable on this runner"
            exit 1
          fi
          rustup toolchain install stable --profile minimal
      - name: Run selector unit tests
        run: cargo +stable test --manifest-path rust/task-selector/Cargo.toml
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run Python-Rust selector shadow parity
        run: python -m unittest discover -s tests -p test_rust_task_selector_shadow.py
      - name: Build optimized Rust selector for benchmark
        run: cargo +stable build --release --manifest-path rust/task-selector/Cargo.toml --bin orca-task-selector
      - name: Benchmark Python vs Rust subprocess bridge
        run: python tests/benchmark_rust_task_selector.py
