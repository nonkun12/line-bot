name: Orca Phase 1 Read-only Observation

on:
  # Safe PR smoke trial: read-only observer only; never claims or executes tasks.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orca-phase1-read-only-observation
  cancel-in-progress: false

jobs:
  observe:
    if: github.repository == 'nonkun12/line-bot' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'nonkun12')
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      ORCA_STATE_BRANCH: orca-state
      ORCA_STATE_PATH: state/queue.json
    steps:
      - name: Checkout observer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Observe state without executing tasks
        run: python scripts/orca_github_phase1_observer.py
