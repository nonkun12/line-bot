name: Local Review Bridge Tests

on:
  pull_request:
    paths:
      - "core/local_review_jobs.py"
      - "tests/test_local_review_jobs.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-queue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile queue contract
        run: python -m py_compile core/local_review_jobs.py
      - name: Run queue contract tests
        env:
          CHAT_DB_PATH: ${{ runner.temp }}/local-review-test.sqlite3
        run: python -m pytest -q tests/test_local_review_jobs.py
