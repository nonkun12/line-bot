name: Local Review Bridge Tests

on:
  pull_request:
    paths:
      - "routes/local_review_bridge.py"
      - "scripts/local_review_bridge_worker.py"
      - "scripts/local_fm_code_review.py"
      - "tests/test_local_review_bridge.py"
      - "tests/test_local_review_bridge_worker.py"
      - "tests/test_local_fm_code_review.py"
      - "db.py"
      - "app.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-bridge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            routes/local_review_bridge.py \
            core/local_review_jobs.py \
            scripts/local_review_bridge_worker.py \
            scripts/local_fm_code_review.py
      - name: Run isolated bridge tests
        env:
          CHAT_DB_PATH: ${{ runner.temp }}/local-review-test.sqlite3
        run: python -m pytest -q tests/test_local_review_bridge.py tests/test_local_review_bridge_worker.py tests/test_local_fm_code_review.py
