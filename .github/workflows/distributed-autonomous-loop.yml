name: Distributed Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Manual run task limit (1 only for MVP)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
  schedule:
    - cron: '30 4 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 12 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 20 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write

concurrency:
  group: distributed-autonomous-loop
  cancel-in-progress: false

jobs:
  minimal-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      SELF_IMPROVEMENT_POLICY_ENFORCED: 'true'
      HERMES_ADVISOR_ENABLED: 'true'
      DEV_USER_ID: autonomous-distributed-loop
      GITHUB_RUN_ID: ${{ github.run_id }}
      AUTONOMOUS_PUBLISH_RESULT: NOT_PUBLISHED
      AUTONOMOUS_PUBLISHED_SHA: ''
    steps:
      - name: Checkout without persistent git credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check remote kill switch
        run: |
          if [ -f .autonomous-loop.stop ]; then
            echo "REMOTE_KILL_SWITCH=ON"
            exit 1
          fi

      - name: Load durable loop state
        run: |
          set -euo pipefail
          rm -f /tmp/autonomous-loop-state.json
          if git ls-remote --exit-code origin refs/heads/autonomous-loop-state >/dev/null 2>&1; then
            git fetch --quiet origin autonomous-loop-state
            if git cat-file -e origin/autonomous-loop-state:.autonomous-loop.stop 2>/dev/null; then
              echo "REMOTE_PERSISTED_KILL_SWITCH=ON"
              exit 1
            fi
            git show origin/autonomous-loop-state:.autonomous-loop-state.json > /tmp/autonomous-loop-state.json
          else
            printf '%s\n' '{"version":1,"completed":[]}' > /tmp/autonomous-loop-state.json
          fi
          python -m json.tool /tmp/autonomous-loop-state.json >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run one bounded autonomous task
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SELF_IMPROVEMENT_HISTORY_PATH: /tmp/line-bot-self-improvement.jsonl
        run: |
          set -euo pipefail
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git remote set-url origin "$auth_url"
          : > /tmp/minimal-autonomous-loop.jsonl
          STOP_FILE=/tmp/line-bot-autonomous-loop.stop

          (
            while sleep 15; do
              if git fetch --quiet origin main 2>/dev/null && git cat-file -e FETCH_HEAD:.autonomous-loop.stop 2>/dev/null; then
                touch "$STOP_FILE"
                exit 0
              fi
            done
          ) &
          POLLER_PID=$!
          trap 'kill "$POLLER_PID" 2>/dev/null || true' EXIT

          python scripts/run_minimal_autonomous_loop.py \
            --max-tasks 1 \
            --stop-file "$STOP_FILE" \
            --state /tmp/autonomous-loop-state.json \
            --results /tmp/minimal-autonomous-loop.jsonl

      - name: Publish verified development branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="line-dev/$GITHUB_RUN_ID"
          head="$(git rev-parse HEAD)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "No development commit was produced; nothing to publish."
            echo "AUTONOMOUS_PUBLISH_RESULT=NO_CHANGE" >> "$GITHUB_ENV"
            echo "AUTONOMOUS_PUBLISHED_SHA=" >> "$GITHUB_ENV"
            exit 0
          fi
          git diff --check "$GITHUB_SHA...HEAD"
          git diff --name-only "$GITHUB_SHA...HEAD"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push --set-upstream "$auth_url" "HEAD:refs/heads/$branch"
          echo "PUBLISHED_BRANCH=$branch"
          echo "PUBLISHED_SHA=$head"
          echo "AUTONOMOUS_PUBLISH_RESULT=PUBLISHED" >> "$GITHUB_ENV"
          echo "AUTONOMOUS_PUBLISHED_SHA=$head" >> "$GITHUB_ENV"

      - name: Persist immediate stop latch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stop_file="/tmp/line-bot-immediate-stop.json"
          if [ ! -e "$stop_file" ]; then
            exit 0
          fi

          state_branch="autonomous-loop-state"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git remote set-url origin "$auth_url"
          if ! git ls-remote --exit-code origin "refs/heads/$state_branch" >/dev/null 2>&1; then
            git push "$auth_url" "refs/remotes/origin/main:refs/heads/$state_branch"
          fi

          git fetch --quiet origin "$state_branch"
          rm -rf /tmp/autonomous-stop-worktree
          git worktree add --detach /tmp/autonomous-stop-worktree "origin/$state_branch"
          cp "$stop_file" /tmp/autonomous-stop-worktree/.autonomous-loop-stop.json
          printf '%s
' 'PERSISTED_IMMEDIATE_STOP=ON' > /tmp/autonomous-stop-worktree/.autonomous-loop.stop
          git -C /tmp/autonomous-stop-worktree config user.name "github-actions[bot]"
          git -C /tmp/autonomous-stop-worktree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/autonomous-stop-worktree add .autonomous-loop.stop .autonomous-loop-stop.json
          if git -C /tmp/autonomous-stop-worktree diff --cached --quiet; then
            echo "Immediate stop latch already persisted."
          else
            git -C /tmp/autonomous-stop-worktree commit -m "chore: persist autonomous loop stop latch"
            git -C /tmp/autonomous-stop-worktree push "$auth_url" HEAD:refs/heads/$state_branch
          fi

      - name: Record distributed loop result to Google Sheets
        if: always()
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          AUTONOMOUS_DEV_LEDGER_RANGE: ${{ secrets.AUTONOMOUS_DEV_LEDGER_RANGE }}
          GOOGLE_SHEETS_AUDIT_RANGE: ${{ secrets.GOOGLE_SHEETS_AUDIT_RANGE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          export AUTONOMOUS_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export AUTONOMOUS_AGENT="DistributedAutonomousLoop"
          export AUTONOMOUS_SOURCE="distributed-autonomous-loop"
          export AUTONOMOUS_START_SHA="$GITHUB_SHA"
          export AUTONOMOUS_TASK_ID="unknown"
          export AUTONOMOUS_TESTS_RESULT="NOT_REPORTED"
          export AUTONOMOUS_VERIFICATION_RESULT="NOT_REPORTED"
          export AUTONOMOUS_SAFETY_GATE_RESULT="BLOCKED"
          export AUTONOMOUS_MERGE_RESULT="NOT_AUTO_MERGED"
          export AUTONOMOUS_PRODUCED_SHA=""
          export AUTONOMOUS_CHANGED_FILES="none"
          export AUTONOMOUS_BLOCKED_FAILED_REASON="workflow_no_loop_evidence"
          export AUTONOMOUS_NEXT_ACTION="review_failure"

          if [ -s /tmp/minimal-autonomous-loop.jsonl ]; then
            _loop_payload="$(python - <<'PY'
          import json
          from pathlib import Path
          lines = [line for line in Path("/tmp/minimal-autonomous-loop.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          if not lines:
              raise SystemExit("loop result file is empty")
          row = json.loads(lines[-1])
          required = ("task_id","status","exit_code","base_sha","produced_sha","failure_reason","tests_result","verification_result","safety_gate_result")
          missing = [key for key in required if key not in row]
          if missing:
              raise SystemExit("loop evidence missing keys: " + ",".join(missing))
          print("\t".join(str(row[key]).replace("\t"," ").replace("\n"," ") for key in required))
          PY
          )" || exit 1

            IFS=$'\t' read -r AUTONOMOUS_TASK_ID _status _exit_code _loop_base_sha _loop_produced_sha _failure_reason AUTONOMOUS_TESTS_RESULT AUTONOMOUS_VERIFICATION_RESULT AUTONOMOUS_SAFETY_GATE_RESULT <<< "$_loop_payload"
            [ -n "$AUTONOMOUS_TASK_ID" ] || exit 1
            [ -n "$_status" ] || exit 1
            [ -n "$_exit_code" ] || exit 1

            if [ "$_exit_code" != "0" ]; then
              export AUTONOMOUS_TESTS_RESULT="FAIL"
              export AUTONOMOUS_VERIFICATION_RESULT="FAIL"
              export AUTONOMOUS_SAFETY_GATE_RESULT="BLOCKED"
              export AUTONOMOUS_PRODUCED_SHA=""
              export AUTONOMOUS_CHANGED_FILES="none"
              export AUTONOMOUS_BLOCKED_FAILED_REASON="loop:$_failure_reason"
              export AUTONOMOUS_NEXT_ACTION="review_failure"
            elif [ "$_status" = "PASS" ]; then
              if [ "$AUTONOMOUS_TESTS_RESULT" != "PASS" ] || [ "$AUTONOMOUS_VERIFICATION_RESULT" != "PASS" ] || [ "$AUTONOMOUS_SAFETY_GATE_RESULT" != "PASS" ]; then
                export AUTONOMOUS_SAFETY_GATE_RESULT="BLOCKED"
                export AUTONOMOUS_BLOCKED_FAILED_REASON="loop:gates_not_independently_reported"
                export AUTONOMOUS_NEXT_ACTION="review_failure"
              elif [ "$AUTONOMOUS_PUBLISH_RESULT" != "PUBLISHED" ] || [ -z "$AUTONOMOUS_PUBLISHED_SHA" ] || [ "$_loop_produced_sha" != "$AUTONOMOUS_PUBLISHED_SHA" ] || [ "$_loop_base_sha" != "$GITHUB_SHA" ]; then
                export AUTONOMOUS_SAFETY_GATE_RESULT="BLOCKED"
                export AUTONOMOUS_BLOCKED_FAILED_REASON="loop:published_sha_or_base_mismatch"
                export AUTONOMOUS_NEXT_ACTION="review_failure"
              else
                export AUTONOMOUS_PRODUCED_SHA="$AUTONOMOUS_PUBLISHED_SHA"
                export AUTONOMOUS_BLOCKED_FAILED_REASON=""
                export AUTONOMOUS_NEXT_ACTION="review_pr"
              fi
            elif [ "$_status" = "NO_CHANGE" ]; then
              export AUTONOMOUS_TESTS_RESULT="NOT_RUN"
              export AUTONOMOUS_VERIFICATION_RESULT="NO_CHANGE"
              export AUTONOMOUS_SAFETY_GATE_RESULT="BLOCKED"
              export AUTONOMOUS_PRODUCED_SHA=""
              export AUTONOMOUS_CHANGED_FILES="none"
              export AUTONOMOUS_BLOCKED_FAILED_REASON="loop:no_change"
              export AUTONOMOUS_NEXT_ACTION="review_failure"
            else
              export AUTONOMOUS_SAFETY_GATE_RESULT="BLOCKED"
              export AUTONOMOUS_PRODUCED_SHA=""
              export AUTONOMOUS_BLOCKED_FAILED_REASON="loop:unpublishable_result:$_status"
              export AUTONOMOUS_NEXT_ACTION="review_failure"
            fi
          fi

          if [ -n "$AUTONOMOUS_PRODUCED_SHA" ]; then
            git rev-parse "$AUTONOMOUS_START_SHA^{commit}" >/dev/null
            git rev-parse "$AUTONOMOUS_PRODUCED_SHA^{commit}" >/dev/null
            AUTONOMOUS_CHANGED_FILES="$(git diff --name-only "$AUTONOMOUS_START_SHA" "$AUTONOMOUS_PRODUCED_SHA" | paste -sd, -)"
            export AUTONOMOUS_CHANGED_FILES
            [ -n "$AUTONOMOUS_CHANGED_FILES" ] || exit 1
          fi

          export DEV_INSTRUCTION="Distributed autonomous loop execution: $AUTONOMOUS_TASK_ID"
          export GITHUB_RUN_ID="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python - <<'PY'
          from agents.sheets.autonomous_ledger import record_autonomous_run
          recorded = record_autonomous_run()
          result = "ALREADY_RECORDED" if not recorded else "RECORDED"
          print(f"Google Sheets logging: {result}", flush=True)
          PY
      - name: Persist completed task state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/minimal-autonomous-loop.jsonl ]; then
            echo "No loop result; state unchanged."
            exit 0
          fi

          status="$(python - <<'PY'
          import json
          from pathlib import Path
          lines = [x for x in Path('/tmp/minimal-autonomous-loop.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          print(json.loads(lines[-1]).get('status', 'FAIL'))
          PY
          )"
          task_id="$(python - <<'PY'
          import json
          from pathlib import Path
          lines = [x for x in Path('/tmp/minimal-autonomous-loop.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          print(json.loads(lines[-1]).get('task_id', ''))
          PY
          )"

          if [[ "$status" != "PASS" && "$status" != "NO_CHANGE" ]] || [ -z "$task_id" ]; then
            echo "State is not advanced: status=$status task_id=$task_id"
            exit 1
          fi

          state_branch="autonomous-loop-state"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if ! git ls-remote --exit-code origin "refs/heads/$state_branch" >/dev/null 2>&1; then
            git push "$auth_url" "refs/remotes/origin/main:refs/heads/$state_branch"
          fi
          git fetch --quiet origin "$state_branch"
          rm -rf /tmp/autonomous-state-worktree
          git worktree add --detach /tmp/autonomous-state-worktree "origin/$state_branch"
          python - "$task_id" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('/tmp/autonomous-state-worktree/.autonomous-loop-state.json')
          if p.exists():
              data = json.loads(p.read_text(encoding='utf-8'))
          else:
              data = {"version": 1, "completed": []}
          completed = data.get("completed", [])
          if not isinstance(completed, list):
              raise SystemExit("invalid durable state")
          task_id = sys.argv[1]
          if task_id not in completed:
              completed.append(task_id)
          data["completed"] = completed
          data["version"] = 1
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
          PY
          git -C /tmp/autonomous-state-worktree config user.name "github-actions[bot]"
          git -C /tmp/autonomous-state-worktree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/autonomous-state-worktree add .autonomous-loop-state.json
          if git -C /tmp/autonomous-state-worktree diff --cached --quiet; then
            echo "State already contains task $task_id"
          else
            git -C /tmp/autonomous-state-worktree commit -m "chore: record autonomous loop completion"
            git -C /tmp/autonomous-state-worktree push "$auth_url" HEAD:refs/heads/$state_branch
          fi

      - name: Upload durable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-autonomous-loop-${{ github.run_id }}
          retention-days: 30
          path: |
            /tmp/minimal-autonomous-loop.jsonl
            /tmp/autonomous-loop-state.json
            /tmp/autonomous-*.json
          if-no-files-found: ignore
