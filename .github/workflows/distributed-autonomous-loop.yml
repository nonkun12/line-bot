name: Distributed Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Manual run task limit (1-4; fail-closed)'
        required: false
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      mode:
        description: 'Run mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - 'normal'
          - 'obsidian_incident'
      incident_category:
        description: 'Allowlisted Obsidian incident category'
        required: false
        default: 'vault_write_failed'
        type: choice
        options:
          - 'local_job_failed'
          - 'vault_write_failed'
      incident_detail:
        description: 'Allowlisted exception class (not raw error text)'
        required: false
        default: 'PermissionError'
        type: choice
        options:
          - 'OSError'
          - 'PermissionError'
          - 'FileNotFoundError'
          - 'IsADirectoryError'
          - 'NotADirectoryError'
          - 'RuntimeError'
          - 'ValueError'
          - 'TypeError'
          - 'KeyError'
          - 'AttributeError'
          - 'UnicodeDecodeError'
      incident_job_id:
        description: 'Numeric Obsidian job ID; no note content'
        required: false
        type: string
  # ChatGPT can request a bounded run by creating an authorized PR comment.
  # The trigger defaults to four tasks and remains fail-closed.
  issue_comment:
    types: [created]
  # Reliable fallback trigger for ChatGPT: adding this exact label to a PR.
  # pull_request_target executes the workflow from the default branch, not PR code.
  pull_request_target:
    types: [labeled]
  schedule:
    # Same four daily fire times, expressed as one cron entry.
    # Changing the cron expression also reactivates a deactivated scheduled workflow.
    - cron: '30 4,10,16,22 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: distributed-autonomous-loop
  cancel-in-progress: false

jobs:
  minimal-loop:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (github.event.comment.body == '/distributed-loop' ||
         github.event.comment.body == '/distributed-loop max_tasks=1' ||
         github.event.comment.body == '/distributed-loop max_tasks=2' ||
         github.event.comment.body == '/distributed-loop max_tasks=3' ||
         github.event.comment.body == '/distributed-loop max_tasks=4') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'distributed-loop-max4' &&
        github.event.sender.login == 'nonkun12' &&
        github.event.pull_request.user.login == 'nonkun12'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAX_TASKS: ${{ github.event_name == 'schedule' && '1' || github.event_name == 'workflow_dispatch' && github.event.inputs.max_tasks || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop max_tasks=1' && '1' || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop max_tasks=2' && '2' || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop max_tasks=3' && '3' || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop max_tasks=4' && '4' || '4' }}
      TRIGGER_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }}
      INCIDENT_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_category || '' }}
      INCIDENT_DETAIL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_detail || '' }}
      INCIDENT_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_job_id || '' }}
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      SELF_IMPROVEMENT_POLICY_ENFORCED: 'true'
      # Hosted loop must not call an unverified cloud Hermes provider.
      HERMES_ADVISOR_ENABLED: 'false'
      SELF_IMPROVEMENT_CREATOR_CRITIC: 'false'
      DEV_USER_ID: autonomous-distributed-loop
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout without persistent git credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record distributed run base commit
        run: echo "AUTONOMOUS_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check remote kill switch
        run: |
          if [ -f .autonomous-loop.stop ]; then
            echo "REMOTE_KILL_SWITCH=ON"
            exit 1
          fi

      - name: Load durable loop state
        run: |
          set -euo pipefail
          rm -f /tmp/autonomous-loop-state.json
          if git ls-remote --exit-code origin refs/heads/autonomous-loop-state >/dev/null 2>&1; then
            git fetch --quiet origin autonomous-loop-state
            git show origin/autonomous-loop-state:.autonomous-loop-state.json > /tmp/autonomous-loop-state.json
          else
            printf '%s\n' '{"version":1,"completed":[]}' > /tmp/autonomous-loop-state.json
          fi
          python -m json.tool /tmp/autonomous-loop-state.json >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate requested task limit
        env:
          REQUESTED_TASK_LIMIT: ${{ env.MAX_TASKS }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          DISPATCH_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_tasks || '' }}
          TRIGGER_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }}
          INCIDENT_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_category || '' }}
          INCIDENT_DETAIL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_detail || '' }}
          INCIDENT_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_job_id || '' }}
        run: |
          set -euo pipefail
          case "${REQUESTED_TASK_LIMIT}" in
            1|2|3|4) ;;
            *) echo "::error::Invalid task limit: ${REQUESTED_TASK_LIMIT}"; exit 1 ;;
          esac
          expected="${REQUESTED_TASK_LIMIT}"
          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            case "${COMMENT_BODY}" in
              "/distributed-loop") expected="4" ;;
              "/distributed-loop max_tasks=1") expected="1" ;;
              "/distributed-loop max_tasks=2") expected="2" ;;
              "/distributed-loop max_tasks=3") expected="3" ;;
              "/distributed-loop max_tasks=4") expected="4" ;;
              *) echo "::error::Unexpected issue-comment trigger"; exit 1 ;;
            esac
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            expected="${DISPATCH_INPUT:-4}"
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            expected="1"
          elif [ "${EVENT_NAME}" = "pull_request_target" ]; then
            expected="4"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${TRIGGER_MODE}" in
              normal)
                ;;
              obsidian_incident)
                if [ "${REQUESTED_TASK_LIMIT}" != "2" ]; then
                  echo "::error::Obsidian incident runs must be capped at exactly two tasks"
                  exit 1
                fi
                case "${INCIDENT_CATEGORY}:${INCIDENT_DETAIL}" in
                  local_job_failed:OSError|local_job_failed:PermissionError|local_job_failed:FileNotFoundError|local_job_failed:IsADirectoryError|local_job_failed:NotADirectoryError|local_job_failed:RuntimeError|local_job_failed:ValueError|local_job_failed:TypeError|local_job_failed:KeyError|local_job_failed:AttributeError|local_job_failed:UnicodeDecodeError|vault_write_failed:OSError|vault_write_failed:PermissionError|vault_write_failed:FileNotFoundError|vault_write_failed:IsADirectoryError|vault_write_failed:NotADirectoryError|vault_write_failed:RuntimeError|vault_write_failed:ValueError|vault_write_failed:TypeError|vault_write_failed:KeyError|vault_write_failed:AttributeError|vault_write_failed:UnicodeDecodeError) ;;
                  *) echo "::error::Incident category/detail is not allowlisted"; exit 1 ;;
                esac
                if [ -n "${INCIDENT_JOB_ID}" ]; then
                  if ! [[ "${INCIDENT_JOB_ID}" =~ ^[1-9][0-9]{0,9}$ ]]; then
                    echo "::error::Invalid incident job ID"
                    exit 1
                  fi
                  if [ "${INCIDENT_JOB_ID}" -gt 2147483647 ]; then
                    echo "::error::Incident job ID is out of range"
                    exit 1
                  fi
                fi
                ;;
              *)
                echo "::error::Unknown workflow dispatch mode"
                exit 1
                ;;
            esac
          elif [ "${TRIGGER_MODE}" != "normal" ]; then
            echo "::error::Incident mode is available only through workflow_dispatch"
            exit 1
          fi
          if [ "${REQUESTED_TASK_LIMIT}" != "${expected}" ]; then
            echo "::error::Task limit mismatch: got=${REQUESTED_TASK_LIMIT} expected=${expected}"
            exit 1
          fi
          echo "Validated bounded task limit: ${REQUESTED_TASK_LIMIT}"

      - name: Run one bounded autonomous task
        id: run_task
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SELF_IMPROVEMENT_HISTORY_PATH: /tmp/line-bot-self-improvement.jsonl
          TRIGGER_MODE: ${{ env.TRIGGER_MODE }}
          INCIDENT_CATEGORY: ${{ env.INCIDENT_CATEGORY }}
          INCIDENT_DETAIL: ${{ env.INCIDENT_DETAIL }}
          INCIDENT_JOB_ID: ${{ env.INCIDENT_JOB_ID }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          : > /tmp/minimal-autonomous-loop.jsonl
          STOP_FILE=/tmp/line-bot-autonomous-loop.stop

          (
            while sleep 15; do
              if git fetch --quiet origin main 2>/dev/null && git cat-file -e FETCH_HEAD:.autonomous-loop.stop 2>/dev/null; then
                touch "$STOP_FILE"
                exit 0
              fi
            done
          ) &
          POLLER_PID=$!
          trap 'kill "$POLLER_PID" 2>/dev/null || true' EXIT

          loop_args=(--max-tasks "${MAX_TASKS}" --stop-file "$STOP_FILE" --state /tmp/autonomous-loop-state.json --results /tmp/minimal-autonomous-loop.jsonl)
          if [ "$TRIGGER_MODE" = "obsidian_incident" ]; then
            loop_args+=(--incident-category "$INCIDENT_CATEGORY" --incident-detail "$INCIDENT_DETAIL")
            if [ -n "$INCIDENT_JOB_ID" ]; then
              loop_args+=(--incident-job-id "$INCIDENT_JOB_ID")
            fi
          fi
          rm -f /tmp/autonomous-loop-not-run
          set +e
          python scripts/run_minimal_autonomous_loop.py "${loop_args[@]}"
          loop_rc=$?
          set -e
          if [ "$loop_rc" -eq 78 ]; then
            echo "queue_empty" > /tmp/autonomous-loop-not-run
            echo "::notice::NOT_RUN: queue_empty - no task was executed."
            exit 0
          fi
          exit "$loop_rc"

      - name: Publish verified development branch
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="line-dev/$GITHUB_RUN_ID"
          head="$(git rev-parse HEAD)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "No development commit was produced; nothing to publish."
            exit 0
          fi
          git diff --check "$GITHUB_SHA...HEAD"
          git diff --name-only "$GITHUB_SHA...HEAD"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push --set-upstream "$auth_url" "HEAD:refs/heads/$branch"
          echo "PUBLISHED_BRANCH=$branch"
          echo "PUBLISHED_SHA=$head"

      - name: Persist completed task state
        id: persist_state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f /tmp/autonomous-loop-not-run ]; then
            echo "NOT_RUN ($(cat /tmp/autonomous-loop-not-run)): no task executed; state unchanged."
            exit 0
          fi
          if [ ! -s /tmp/minimal-autonomous-loop.jsonl ]; then
            echo "No loop result; state unchanged."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/minimal-autonomous-loop.jsonl')
          lines = [x for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          results = [json.loads(line) for line in lines]
          if not results:
              raise SystemExit("no loop results")
          completed_ids = []
          for result in results:
              status = result.get("status", "FAIL")
              task_id = result.get("task_id", "")
              if status not in {"PASS", "NO_CHANGE"} or not task_id:
                  raise SystemExit(
                      f"State is not advanced: status={status} task_id={task_id}"
                  )
              if task_id not in completed_ids:
                  completed_ids.append(task_id)
          Path('/tmp/autonomous-completed-task-ids.json').write_text(
              json.dumps(completed_ids, ensure_ascii=False),
              encoding='utf-8',
          )
          print("Completed task IDs:", ", ".join(completed_ids))
          PY

          state_branch="autonomous-loop-state"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if ! git ls-remote --exit-code origin "refs/heads/$state_branch" >/dev/null 2>&1; then
            git push "$auth_url" "refs/remotes/origin/main:refs/heads/$state_branch"
          fi
          git fetch --quiet origin "$state_branch"
          rm -rf /tmp/autonomous-state-worktree
          git worktree add --detach /tmp/autonomous-state-worktree "origin/$state_branch"
          python - <<'PY'
          import json
          from pathlib import Path
          state_path = Path('/tmp/autonomous-state-worktree/.autonomous-loop-state.json')
          ids_path = Path('/tmp/autonomous-completed-task-ids.json')
          if state_path.exists():
              data = json.loads(state_path.read_text(encoding='utf-8'))
          else:
              data = {"version": 1, "completed": []}
          completed = data.get("completed", [])
          if not isinstance(completed, list):
              raise SystemExit("invalid durable state")
          task_ids = json.loads(ids_path.read_text(encoding='utf-8'))
          if not isinstance(task_ids, list) or not task_ids:
              raise SystemExit("invalid completed task IDs")
          for task_id in task_ids:
              if not isinstance(task_id, str) or not task_id:
                  raise SystemExit("invalid completed task ID")
              if task_id not in completed:
                  completed.append(task_id)
          data["completed"] = completed
          data["version"] = 1
          state_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
          PY
          git -C /tmp/autonomous-state-worktree config user.name "github-actions[bot]"
          git -C /tmp/autonomous-state-worktree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/autonomous-state-worktree add .autonomous-loop-state.json
          if git -C /tmp/autonomous-state-worktree diff --cached --quiet; then
            echo "Durable state already contains all completed task IDs."
          else
            git -C /tmp/autonomous-state-worktree commit -m "chore: record autonomous loop completion"
            git -C /tmp/autonomous-state-worktree push "$auth_url" HEAD:refs/heads/$state_branch
          fi

      - name: Record distributed run result to Google Sheets
        if: always()
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          AUTONOMOUS_DEV_LEDGER_RANGE: ${{ secrets.AUTONOMOUS_DEV_LEDGER_RANGE || 'AutonomousDevelopment!A:ZZ' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          DEV_INSTRUCTION: Distributed autonomous loop scheduled task
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LOOP_OUTCOME: ${{ steps.run_task.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STATE_OUTCOME: ${{ steps.persist_state.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export AUTONOMOUS_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export AUTONOMOUS_START_SHA="${AUTONOMOUS_START_SHA:-$GITHUB_SHA}"
          export AUTONOMOUS_PRODUCED_SHA="$(git rev-parse HEAD 2>/dev/null || printf '%s' "$GITHUB_SHA")"
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            export AUTONOMOUS_CHANGED_FILES="$(git diff --name-only "$AUTONOMOUS_START_SHA" "$AUTONOMOUS_PRODUCED_SHA" | paste -sd, -)"
          else
            export AUTONOMOUS_CHANGED_FILES=""
          fi
          export AUTONOMOUS_SOURCE="distributed-loop"
          export AUTONOMOUS_AGENT="DistributedAutonomousLoop"
          export AUTONOMOUS_PR_URL=""
          echo "Google Sheets ledger target: ${AUTONOMOUS_DEV_LEDGER_RANGE}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results_path = Path('/tmp/minimal-autonomous-loop.jsonl')
          rows = []
          if results_path.exists():
              for line in results_path.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      try:
                          value = json.loads(line)
                          if isinstance(value, dict):
                              rows.append(value)
                      except json.JSONDecodeError:
                          pass
          result = rows[-1] if rows else {}
          status = str(result.get('status') or '')
          task_id = str(result.get('task_id') or '')
          run_outcome = os.getenv('LOOP_OUTCOME', '')
          publish = os.getenv('PUBLISH_OUTCOME', '')
          state = os.getenv('STATE_OUTCOME', '')

          not_run = os.path.exists('/tmp/autonomous-loop-not-run')
          if not_run:
              status = 'NOT_RUN'
          elif status not in {'PASS', 'NO_CHANGE', 'FAIL', 'BLOCKED'}:
              status = 'BLOCKED' if not result or status in {'STOPPED', 'TIMEOUT'} else 'FAIL'
          os.environ['AUTONOMOUS_TASK_ID'] = task_id or 'distributed-loop-no-task-result'
          os.environ['DEV_INSTRUCTION'] = str(result.get('summary') or result.get('task_summary') or os.environ['DEV_INSTRUCTION'])
          os.environ['AUTONOMOUS_TESTS_RESULT'] = status
          if status == 'NOT_RUN':
              os.environ['AUTONOMOUS_VERIFICATION_RESULT'] = 'NOT_RUN'
              os.environ['AUTONOMOUS_SAFETY_GATE_RESULT'] = 'NOT_RUN'
          else:
              os.environ['AUTONOMOUS_VERIFICATION_RESULT'] = 'PASS' if publish == 'success' else ('NOT_RUN' if publish == 'skipped' else 'FAIL')
              os.environ['AUTONOMOUS_SAFETY_GATE_RESULT'] = 'PASS' if status in {'PASS', 'NO_CHANGE'} and run_outcome == 'success' and publish == 'success' and state == 'success' else 'BLOCKED'
          os.environ['AUTONOMOUS_MERGE_RESULT'] = 'NOT_AUTO_MERGED'
          reason = str(result.get('failure_reason') or '')
          if not reason and status not in {'PASS', 'NO_CHANGE'}:
              reason = f"loop_{status.lower()}" if result else f"workflow_failed_before_result:{run_outcome or 'not_run'}"
          if not reason and publish not in {'success', 'skipped'}:
              reason = f'publish_{publish or "not_run"}'
          if not reason and state not in {'success', 'skipped'}:
              reason = f'state_persistence_{state or "not_run"}'
          os.environ['AUTONOMOUS_BLOCKED_FAILED_REASON'] = reason
          if status == 'PASS' and run_outcome == 'success' and publish == 'success' and state == 'success':
              action = 'review_changes'
          elif status == 'NO_CHANGE':
              action = 'none'
          elif status == 'NOT_RUN':
              action = 'replenish_task_queue'
          else:
              action = 'inspect_workflow_run'
          os.environ['AUTONOMOUS_NEXT_ACTION'] = action

          from agents.sheets.autonomous_ledger import record_autonomous_run
          try:
              recorded = record_autonomous_run()
          except Exception as exc:
              error_text = f"{type(exc).__name__}: {exc}"
              os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'] = 'ERROR'
              Path('/tmp/distributed-sheets-log-result.json').write_text(
                  json.dumps({
                      'run_id': os.environ.get('GITHUB_RUN_ID', ''),
                      'task_id': os.environ.get('AUTONOMOUS_TASK_ID', ''),
                      'result': 'ERROR',
                      'error_type': type(exc).__name__,
                      'error': str(exc),
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print(f'distributed run Sheets ledger result: ERROR: {error_text}')
              raise
          else:
              os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'] = 'RECORDED' if recorded else 'ALREADY_RECORDED'
              print(f'distributed run Sheets ledger result: {os.environ["AUTONOMOUS_SHEETS_LOG_RESULT"]}')
              Path('/tmp/distributed-sheets-log-result.json').write_text(
                  json.dumps({
                      'run_id': os.environ.get('GITHUB_RUN_ID', ''),
                      'task_id': os.environ.get('AUTONOMOUS_TASK_ID', ''),
                      'result': os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'],
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Build final distributed loop report
        if: always()
        env:
          MAX_TASKS: ${{ env.MAX_TASKS }}
          LOOP_OUTCOME: ${{ steps.run_task.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STATE_OUTCOME: ${{ steps.persist_state.outcome }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          requested="${MAX_TASKS:-4}"
          completed=0
          if [ -s /tmp/minimal-autonomous-loop.jsonl ]; then
            completed="$(python -c 'import json; from pathlib import Path; print(sum(1 for line in Path("/tmp/minimal-autonomous-loop.jsonl").read_text(encoding="utf-8").splitlines() if line.strip() and isinstance(json.loads(line), dict) and json.loads(line).get("status") in {"PASS","NO_CHANGE"}))')"
          fi
          queue_total="$(python -c 'import json; from pathlib import Path; print(len(json.loads(Path(".github/autonomous-loop-tasks.json").read_text(encoding="utf-8")).get("tasks", [])))')"
          state_current_completed="$(python - <<'PY'
          import json
          from pathlib import Path
          queue = json.loads(Path(".github/autonomous-loop-tasks.json").read_text(encoding="utf-8")).get("tasks", [])
          completed = set(json.loads(Path("/tmp/autonomous-loop-state.json").read_text(encoding="utf-8")).get("completed", []))
          ids = [task.get("id") for task in queue if isinstance(task, dict)]
          print(sum(1 for task_id in ids if task_id in completed))
          PY
          )"
          queue_completed=$((state_current_completed + completed))
          if [ "$queue_completed" -gt "$queue_total" ]; then queue_completed="$queue_total"; fi
          result="STOPPED/FAILED"
          result_reason="workflow_failed"
          if [ "${LOOP_OUTCOME:-}" = "success" ] && [ -f /tmp/autonomous-loop-not-run ] && [ "$completed" = "0" ]; then
            result="NOT_RUN"
            result_reason="$(cat /tmp/autonomous-loop-not-run)"
          elif [ "${LOOP_OUTCOME:-}" = "success" ] && [ "$completed" -ge 1 ] && { [ "$completed" = "$requested" ] || [ "$queue_completed" = "$queue_total" ]; }; then
            result="COMPLETED"
            if [ "$completed" = "$requested" ]; then
              result_reason="requested_task_limit_reached"
            else
              result_reason="queue_completed"
            fi
          fi
          produced_sha="$(git rev-parse HEAD 2>/dev/null || echo "${GITHUB_SHA}")"
          {
            echo "# 分散Loop 終了報告"
            echo
            echo "- 結果: **$result**"
            echo "- 結果理由: $result_reason"
            echo "- 今回の実行タスク: ${completed}/${requested}"
            echo "- キュー進捗: ${queue_completed}/${queue_total}"
            echo "- 最終SHA: ${produced_sha}"
            echo "- Task実行: ${LOOP_OUTCOME:-not_run}"
            echo "- Publish: ${PUBLISH_OUTCOME:-not_run}"
            echo "- State: ${STATE_OUTCOME:-not_run}"
            echo "- Job: ${JOB_STATUS:-unknown}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### Task別結果"
            if [ "$result" = "NOT_RUN" ]; then
              echo "(NOT_RUN: タスクは1件も実行されていません。理由: ${result_reason}。キューは ${queue_completed}/${queue_total} で、未完了Taskがありません。タスクの補充が必要です。)"
            fi
            if [ -s /tmp/minimal-autonomous-loop.jsonl ]; then
              cat /tmp/minimal-autonomous-loop.jsonl
            elif [ "$result" = "NOT_RUN" ]; then
              :
            else
              echo "(結果なし: Task結果ファイルが生成されませんでした。)"
            fi
          } | tee /tmp/distributed-final-report.txt >> "$GITHUB_STEP_SUMMARY"

          if { [ "${GITHUB_EVENT_NAME}" = "issue_comment" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; } && [ -n "${PR_NUMBER:-}" ] && command -v gh >/dev/null 2>&1; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/distributed-final-report.txt || true
          fi

      - name: Wake Render before LINE final report
        if: always()
        run: |
          set -euo pipefail
          # Free Render instances may need time to wake after inactivity.
          # Retry only the harmless health check; do not repeat the task or push request.
          if ! curl --fail-with-body --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors --max-time 30 \
            "https://line-bot-yvea.onrender.com/health"; then
            echo "::warning::Render health warm-up failed; continuing to the single LINE push attempt."
          fi
      - name: Notify LINE of distributed loop final report
        if: always()
        env:
          LINE_INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          DISTRIBUTED_LOOP_LINE_USER_ID: ${{ secrets.DISTRIBUTED_LOOP_LINE_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${LINE_INTERNAL_PUSH_KEY:-}" ] || [ -z "${DISTRIBUTED_LOOP_LINE_USER_ID:-}" ]; then
            echo "LINE success notification skipped: required GitHub secrets are not configured."
            exit 0
          fi
          # Every completed distributed-loop run must send its final report to LINE,
          # including queue-exhausted runs, so LINE remains the authoritative user-facing status.
          if [ -s /tmp/distributed-final-report.txt ]; then
            message="$(cat /tmp/distributed-final-report.txt)"
          else
            message="⚠️ 分散Loop終了報告を生成できませんでした。Run #${{ github.run_number }}"
          fi
          export MESSAGE="$message"
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({'user_id': os.environ['DISTRIBUTED_LOOP_LINE_USER_ID'], 'message': os.environ['MESSAGE']}, ensure_ascii=False))
          PY
          )"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "https://line-bot-yvea.onrender.com/internal/push" \
            -H "Content-Type: application/json" \
            -H "x-internal-key: ${LINE_INTERNAL_PUSH_KEY}" \
            --data "$payload"
      - name: Upload durable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-autonomous-loop-${{ github.run_id }}
          retention-days: 30
          path: |
            /tmp/minimal-autonomous-loop.jsonl
            /tmp/autonomous-loop-state.json
            /tmp/autonomous-*.json
            /tmp/distributed-sheets-log-result.json
            /tmp/distributed-final-report.txt
          if-no-files-found: ignore

