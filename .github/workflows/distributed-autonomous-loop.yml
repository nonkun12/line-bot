name: Distributed Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Manual run task limit (1-4; fail-closed)'
        required: false
        default: '4'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      mode:
        description: 'Run mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - 'normal'
          - 'obsidian_incident'
      incident_category:
        description: 'Allowlisted Obsidian incident category'
        required: false
        default: 'vault_write_failed'
        type: choice
        options:
          - 'local_job_failed'
          - 'vault_write_failed'
      incident_detail:
        description: 'Allowlisted exception class (not raw error text)'
        required: false
        default: 'PermissionError'
        type: choice
        options:
          - 'OSError'
          - 'PermissionError'
          - 'FileNotFoundError'
          - 'IsADirectoryError'
          - 'NotADirectoryError'
          - 'RuntimeError'
          - 'ValueError'
          - 'TypeError'
          - 'KeyError'
          - 'AttributeError'
          - 'UnicodeDecodeError'
      incident_job_id:
        description: 'Numeric Obsidian job ID; no note content'
        required: false
        type: string
      resume_task_id:
        description: 'Resume exactly one held task after its cause is fixed'
        required: false
        default: ''
        type: string
      confirm_cause_fixed:
        description: 'Confirm that the selected task failure cause has been fixed'
        required: false
        default: false
        type: boolean
  # ChatGPT can request a bounded run by creating an authorized PR comment.
  # The trigger defaults to four tasks and remains fail-closed.
  issue_comment:
    types: [created]
  # Reliable fallback trigger for ChatGPT: adding this exact label to a PR.
  # pull_request_target executes the workflow from the default branch, not PR code.
  pull_request_target:
    types: [labeled]
  schedule:
    # Same four daily fire times, expressed as one cron entry.
    # Changing the cron expression also reactivates a deactivated scheduled workflow.
    - cron: '30 4,10,16,22 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: distributed-autonomous-loop
  cancel-in-progress: false

jobs:
  minimal-loop:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (github.event.comment.body == '/distributed-loop' ||
         github.event.comment.body == '/distributed-loop max_tasks=1' ||
         github.event.comment.body == '/distributed-loop max_tasks=2' ||
         github.event.comment.body == '/distributed-loop max_tasks=3' ||
         github.event.comment.body == '/distributed-loop max_tasks=4' ||
         github.event.comment.body == '/distributed-loop resume_task_id=ai-speaker-empty-transcript-no-brain-call confirm_cause_fixed=true') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'distributed-loop-max4' &&
        github.event.sender.login == 'nonkun12' &&
        github.event.pull_request.user.login == 'nonkun12'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAX_TASKS: ${{ github.event_name == 'schedule' && '1' || github.event_name == 'workflow_dispatch' && github.event.inputs.resume_task_id && '1' || github.event_name == 'workflow_dispatch' && github.event.inputs.max_tasks || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop resume_task_id=ai-speaker-empty-transcript-no-brain-call confirm_cause_fixed=true' && '1' || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop max_tasks=1' && '1' || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop max_tasks=2' && '2' || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop max_tasks=3' && '3' || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop max_tasks=4' && '4' || '4' }}
      TRIGGER_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }}
      INCIDENT_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_category || '' }}
      INCIDENT_DETAIL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_detail || '' }}
      INCIDENT_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_job_id || '' }}
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      SELF_IMPROVEMENT_POLICY_ENFORCED: 'true'
      # Hosted loop must not call an unverified cloud Hermes provider.
      HERMES_ADVISOR_ENABLED: 'false'
      SELF_IMPROVEMENT_CREATOR_CRITIC: 'false'
      DEV_USER_ID: autonomous-distributed-loop
      GITHUB_RUN_ID: ${{ github.run_id }}
      # Runtime prepares changes; only the workflow's scoped GH_TOKEN step publishes.
      AUTONOMOUS_PUBLISH_VIA_WORKFLOW: 'true'
    steps:
      - name: Checkout without persistent git credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record distributed run base commit
        run: echo "AUTONOMOUS_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check remote kill switch
        run: |
          if [ -f .autonomous-loop.stop ]; then
            echo "REMOTE_KILL_SWITCH=ON"
            exit 1
          fi

      - name: Load durable loop state
        run: |
          set -euo pipefail
          rm -f /tmp/autonomous-loop-state.json
          if git ls-remote --exit-code origin refs/heads/autonomous-loop-state >/dev/null 2>&1; then
            git fetch --quiet origin autonomous-loop-state
            git show origin/autonomous-loop-state:.autonomous-loop-state.json > /tmp/autonomous-loop-state.json
          else
            printf '%s\n' '{"version":1,"completed":[]}' > /tmp/autonomous-loop-state.json
          fi
          python -m json.tool /tmp/autonomous-loop-state.json >/dev/null

          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('/tmp/autonomous-loop-state.json').read_text(encoding='utf-8'))
          if 'recovery_ai' not in state:
              raise SystemExit('durable Recovery AI state is missing; refusing to run')
          recovery = state['recovery_ai']
          if (not isinstance(recovery, dict) or recovery.get('schema_version') != 1
                  or not isinstance(recovery.get('tasks'), dict) or 'checkpoint' not in recovery):
              raise SystemExit('durable Recovery AI state is invalid; refusing to run')
          Path('/tmp/recovery-ai-state.json').write_text(
              json.dumps(recovery, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate requested task limit
        env:
          REQUESTED_TASK_LIMIT: ${{ env.MAX_TASKS }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          DISPATCH_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.max_tasks || '' }}
          RESUME_TASK_ID: ${{ github.event.inputs.resume_task_id || '' }}
          TRIGGER_MODE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode || 'normal' }}
          INCIDENT_CATEGORY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_category || '' }}
          INCIDENT_DETAIL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_detail || '' }}
          INCIDENT_JOB_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.incident_job_id || '' }}
        run: |
          set -euo pipefail
          case "${REQUESTED_TASK_LIMIT}" in
            1|2|3|4) ;;
            *) echo "::error::Invalid task limit: ${REQUESTED_TASK_LIMIT}"; exit 1 ;;
          esac
          expected="${REQUESTED_TASK_LIMIT}"
          if [ "${EVENT_NAME}" = "issue_comment" ]; then
            case "${COMMENT_BODY}" in
              "/distributed-loop") expected="4" ;;
              "/distributed-loop max_tasks=1") expected="1" ;;
              "/distributed-loop max_tasks=2") expected="2" ;;
              "/distributed-loop max_tasks=3") expected="3" ;;
              "/distributed-loop max_tasks=4") expected="4" ;;
              "/distributed-loop resume_task_id=ai-speaker-empty-transcript-no-brain-call confirm_cause_fixed=true") expected="1" ;;
              *) echo "::error::Unexpected issue-comment trigger"; exit 1 ;;
            esac
          elif [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            expected="${DISPATCH_INPUT:-4}"
            if [ -n "${RESUME_TASK_ID}" ]; then expected="1"; fi
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            expected="1"
          elif [ "${EVENT_NAME}" = "pull_request_target" ]; then
            expected="4"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            case "${TRIGGER_MODE}" in
              normal)
                ;;
              obsidian_incident)
                if [ "${REQUESTED_TASK_LIMIT}" != "2" ]; then
                  echo "::error::Obsidian incident runs must be capped at exactly two tasks"
                  exit 1
                fi
                case "${INCIDENT_CATEGORY}:${INCIDENT_DETAIL}" in
                  local_job_failed:OSError|local_job_failed:PermissionError|local_job_failed:FileNotFoundError|local_job_failed:IsADirectoryError|local_job_failed:NotADirectoryError|local_job_failed:RuntimeError|local_job_failed:ValueError|local_job_failed:TypeError|local_job_failed:KeyError|local_job_failed:AttributeError|local_job_failed:UnicodeDecodeError|vault_write_failed:OSError|vault_write_failed:PermissionError|vault_write_failed:FileNotFoundError|vault_write_failed:IsADirectoryError|vault_write_failed:NotADirectoryError|vault_write_failed:RuntimeError|vault_write_failed:ValueError|vault_write_failed:TypeError|vault_write_failed:KeyError|vault_write_failed:AttributeError|vault_write_failed:UnicodeDecodeError) ;;
                  *) echo "::error::Incident category/detail is not allowlisted"; exit 1 ;;
                esac
                if [ -n "${INCIDENT_JOB_ID}" ]; then
                  if ! [[ "${INCIDENT_JOB_ID}" =~ ^[1-9][0-9]{0,9}$ ]]; then
                    echo "::error::Invalid incident job ID"
                    exit 1
                  fi
                  if [ "${INCIDENT_JOB_ID}" -gt 2147483647 ]; then
                    echo "::error::Incident job ID is out of range"
                    exit 1
                  fi
                fi
                ;;
              *)
                echo "::error::Unknown workflow dispatch mode"
                exit 1
                ;;
            esac
          elif [ "${TRIGGER_MODE}" != "normal" ]; then
            echo "::error::Incident mode is available only through workflow_dispatch"
            exit 1
          fi
          if [ "${REQUESTED_TASK_LIMIT}" != "${expected}" ]; then
            echo "::error::Task limit mismatch: got=${REQUESTED_TASK_LIMIT} expected=${expected}"
            exit 1
          fi
          echo "Validated bounded task limit: ${REQUESTED_TASK_LIMIT}"

      - name: Validate held-task resume request
        if: >-
          success() && (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.resume_task_id != '') ||
            (github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop resume_task_id=ai-speaker-empty-transcript-no-brain-call confirm_cause_fixed=true')
          )
        env:
          RESUME_TASK_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.resume_task_id || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop resume_task_id=ai-speaker-empty-transcript-no-brain-call confirm_cause_fixed=true' && 'ai-speaker-empty-transcript-no-brain-call' || '' }}
          CONFIRM_CAUSE_FIXED: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_cause_fixed || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop resume_task_id=ai-speaker-empty-transcript-no-brain-call confirm_cause_fixed=true' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -n "$RESUME_TASK_ID" ]; then
            if [ "$CONFIRM_CAUSE_FIXED" != "true" ]; then
              echo "::error::A held task can resume only with explicit cause-fixed confirmation."
              exit 1
            fi
            if ! [[ "$RESUME_TASK_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
              echo "::error::Invalid task ID."
              exit 1
            fi
          elif [ "$CONFIRM_CAUSE_FIXED" = "true" ]; then
            echo "::error::Cause-fixed confirmation requires a task ID."
            exit 1
          fi

      - name: Resume one explicitly approved held task
        if: >-
          success() && (
            (github.event_name == 'workflow_dispatch' && github.event.inputs.resume_task_id != '') ||
            (github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop resume_task_id=ai-speaker-empty-transcript-no-brain-call confirm_cause_fixed=true')
          )
        env:
          RESUME_TASK_ID: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.resume_task_id || github.event_name == 'issue_comment' && github.event.comment.body == '/distributed-loop resume_task_id=ai-speaker-empty-transcript-no-brain-call confirm_cause_fixed=true' && 'ai-speaker-empty-transcript-no-brain-call' || '' }}
        run: |
          set -euo pipefail
          python -m scripts.resume_held_task \
            --state /tmp/autonomous-loop-state.json \
            --recovery-state /tmp/recovery-ai-state.json \
            --queue .github/autonomous-loop-tasks.json \
            --task-id "$RESUME_TASK_ID" \
            --cause-fixed

      - name: Restore durable Recovery RAG history
        if: success()
        env:
          RECOVERY_RAG_DB_PATH: /tmp/recovery-rag.sqlite3
          RECOVERY_RAG_NAMESPACE: distributed-loop
        run: |
          set -euo pipefail
          python -m scripts.recovery_rag_state --mode import --state /tmp/autonomous-loop-state.json --db "$RECOVERY_RAG_DB_PATH" --namespace "$RECOVERY_RAG_NAMESPACE"

      - name: Restore sanitized self-improvement history
        if: success()
        run: |
          set -euo pipefail
          python scripts/self_improvement_state.py import \
            --state /tmp/autonomous-loop-state.json \
            --history /tmp/line-bot-self-improvement.jsonl

      - name: Prepare bounded runtime task refill
        if: success() && env.TRIGGER_MODE == 'normal'
        run: |
          set -euo pipefail
          python -m scripts.autonomous_task_refill \
            --queue .github/autonomous-loop-tasks.json \
            --catalog .github/autonomous-loop-task-catalog.json \
            --completed-state /tmp/autonomous-loop-state.json \
            --output /tmp/autonomous-loop-runtime-queue.json
          echo "AUTONOMOUS_LOOP_TASK_QUEUE=/tmp/autonomous-loop-runtime-queue.json" >> "$GITHUB_ENV"

      - name: Run one bounded autonomous task
        id: run_task
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SELF_IMPROVEMENT_HISTORY_PATH: /tmp/line-bot-self-improvement.jsonl
          # RAG is advisory and sanitized; the authoritative Recovery AI state
          # remains durable in autonomous-loop-state. This SQLite cache is run-local.
          RECOVERY_RAG_DB_PATH: /tmp/recovery-rag.sqlite3
          RECOVERY_RAG_NAMESPACE: distributed-loop
          TRIGGER_MODE: ${{ env.TRIGGER_MODE }}
          INCIDENT_CATEGORY: ${{ env.INCIDENT_CATEGORY }}
          INCIDENT_DETAIL: ${{ env.INCIDENT_DETAIL }}
          INCIDENT_JOB_ID: ${{ env.INCIDENT_JOB_ID }}
        run: |
          set -euo pipefail
          : > /tmp/minimal-autonomous-loop.jsonl
          STOP_FILE=/tmp/line-bot-autonomous-loop.stop

          (
            while sleep 15; do
              if git fetch --quiet origin main 2>/dev/null && git cat-file -e FETCH_HEAD:.autonomous-loop.stop 2>/dev/null; then
                touch "$STOP_FILE"
                exit 0
              fi
            done
          ) &
          POLLER_PID=$!
          trap 'kill "$POLLER_PID" 2>/dev/null || true' EXIT

          # Never let a reused self-hosted runner carry result rows into this run.
          # Stale PASS rows could otherwise inflate the final task count for NOT_RUN.
          rm -f /tmp/minimal-autonomous-loop.jsonl
          loop_args=(--max-tasks "${MAX_TASKS}" --stop-file "$STOP_FILE" --state /tmp/autonomous-loop-state.json --results /tmp/minimal-autonomous-loop.jsonl)
          if [ "$TRIGGER_MODE" = "obsidian_incident" ]; then
            loop_args+=(--incident-category "$INCIDENT_CATEGORY" --incident-detail "$INCIDENT_DETAIL")
            if [ -n "$INCIDENT_JOB_ID" ]; then
              loop_args+=(--incident-job-id "$INCIDENT_JOB_ID")
            fi
          fi
          rm -f /tmp/autonomous-loop-not-run
          set +e
          python scripts/run_minimal_autonomous_loop.py "${loop_args[@]}"
          loop_rc=$?
          set -e
          if [ "$loop_rc" -eq 78 ]; then
            echo "queue_empty" > /tmp/autonomous-loop-not-run
            echo "::notice::NOT_RUN: queue_empty - no task was executed."
            exit 0
          fi
          if [ "$loop_rc" -eq 79 ]; then
            echo "all_pending_tasks_held" > /tmp/autonomous-loop-held-tasks
            echo "::warning::BLOCKED: all pending tasks are held for human review."
            exit 0
          fi
          exit "$loop_rc"

      - name: Export sanitized Recovery RAG history
        if: ${{ !cancelled() && steps.run_task.conclusion != 'skipped' }}
        env:
          RECOVERY_RAG_DB_PATH: /tmp/recovery-rag.sqlite3
          RECOVERY_RAG_NAMESPACE: distributed-loop
        run: |
          set -euo pipefail
          if [ -f /tmp/autonomous-loop-not-run ] || [ -f /tmp/autonomous-loop-held-tasks ]; then
            echo "No task ran; durable RAG history unchanged."
            exit 0
          fi
          if [ ! -s /tmp/minimal-autonomous-loop.jsonl ] || [ ! -f "$RECOVERY_RAG_DB_PATH" ]; then
            echo "::error::RAG export evidence is missing."
            exit 1
          fi
          python -m scripts.recovery_rag_state --mode export --state /tmp/recovery-rag-state.json --db "$RECOVERY_RAG_DB_PATH" --namespace "$RECOVERY_RAG_NAMESPACE"

      - name: Publish verified development branch
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_TASKS: ${{ env.MAX_TASKS }}
        run: |
          set -euo pipefail
          branch="line-dev/$GITHUB_RUN_ID"
          head="$(git rev-parse HEAD)"

          # NOT_RUN/held are valid bounded outcomes, but never publish a branch
          # unless this run has complete, matching task evidence.
          if [ -f /tmp/autonomous-loop-not-run ] || [ -f /tmp/autonomous-loop-held-tasks ]; then
            if [ "$head" != "$GITHUB_SHA" ]; then
              echo "::error::No-task/held run unexpectedly changed HEAD; refusing publication."
              exit 1
            fi
            echo "No verified task commit; nothing to publish."
            exit 0
          fi
          if [ ! -s /tmp/minimal-autonomous-loop.jsonl ]; then
            echo "::error::Task evidence is missing; refusing publication."
            exit 1
          fi

          # Independent publish gate: do not rely only on the loop process exit
          # code. Validate every record and require the final evidence SHA to be
          # the exact commit being pushed. Any malformed/failed row blocks push.
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          path = Path("/tmp/minimal-autonomous-loop.jsonl")
          rows = []
          for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
              if not line.strip():
                  continue
              try:
                  row = json.loads(line)
              except json.JSONDecodeError as exc:
                  raise SystemExit(f"invalid task evidence JSON on line {number}") from exc
              if not isinstance(row, dict):
                  raise SystemExit(f"task evidence line {number} is not an object")
              if row.get("status") not in {"PASS", "NO_CHANGE"}:
                  raise SystemExit(f"unsafe task status on line {number}; refusing publication")
              task_id = row.get("task_id")
              if not isinstance(task_id, str) or not task_id.strip():
                  raise SystemExit(f"missing task ID on line {number}")
              for key in ("base_sha", "produced_sha"):
                  value = row.get(key)
                  if not isinstance(value, str) or len(value) != 40 or any(c not in "0123456789abcdef" for c in value.lower()):
                      raise SystemExit(f"invalid {key} on line {number}")
              if row.get("exit_code") != 0:
                  raise SystemExit(f"nonzero task exit code on line {number}")
              rows.append(row)

          try:
              limit = int(os.environ["MAX_TASKS"])
          except (KeyError, ValueError) as exc:
              raise SystemExit("invalid MAX_TASKS at publish gate") from exc
          if not rows or len(rows) > limit or len(rows) > 4:
              raise SystemExit("task evidence count is empty or exceeds the run limit")
          ids = [row["task_id"] for row in rows]
          if len(ids) != len(set(ids)):
              raise SystemExit("duplicate task IDs in run evidence")

          # Independently enforce each queued task's exact changed-file allowlist.
          queue_path = Path(os.environ.get("AUTONOMOUS_LOOP_TASK_QUEUE", ".github/autonomous-loop-tasks.json"))
          queue_data = json.loads(queue_path.read_text(encoding="utf-8"))
          queued_tasks = queue_data.get("tasks", [])
          if not isinstance(queued_tasks, list):
              raise SystemExit("task queue has an invalid tasks list")
          task_by_id = {
              item.get("id"): item
              for item in queued_tasks
              if isinstance(item, dict) and isinstance(item.get("id"), str)
          }
          for row in rows:
              task = task_by_id.get(row["task_id"])
              allowed = task.get("allowed_paths") if isinstance(task, dict) else None
              if not isinstance(allowed, list) or not allowed or not all(
                  isinstance(p, str) and p.strip() and not p.startswith("/")
                  and "\\" not in p and all(part not in {"", ".", ".."} for part in p.split("/"))
                  for p in allowed
              ):
                  raise SystemExit(f"task has no safe exact path allowlist: {row['task_id']}")
              diff = subprocess.run(
                  ["git", "diff", "--no-renames", "--name-only", row["base_sha"], row["produced_sha"]],
                  check=True, capture_output=True, text=True,
              ).stdout.splitlines()
              unexpected = sorted(set(diff) - set(allowed))
              if unexpected:
                  raise SystemExit(
                      f"task changed paths outside its allowlist: {row['task_id']}: {unexpected}"
                  )

          head_result = subprocess.run(
              ["git", "rev-parse", "HEAD"], check=True, capture_output=True, text=True
          )
          final_head = head_result.stdout.strip()
          if rows[-1]["produced_sha"] != final_head:
              raise SystemExit("final task evidence SHA does not match HEAD")
          for previous, current in zip(rows, rows[1:]):
              if previous["produced_sha"] != current["base_sha"]:
                  raise SystemExit("task evidence SHA chain is discontinuous")
          if rows[0]["base_sha"] != os.environ.get("GITHUB_SHA"):
              raise SystemExit("first task base SHA does not match workflow start SHA")
          PY

          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "Verified NO_CHANGE run; nothing to publish."
            exit 0
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "$head"
          git diff --check "$GITHUB_SHA...$head"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push --set-upstream "$auth_url" "HEAD:refs/heads/$branch"
          echo "PUBLISHED_BRANCH=$branch"
          echo "PUBLISHED_SHA=$head"

      - name: Persist completed task state
        id: persist_state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f /tmp/autonomous-loop-not-run ] || [ -f /tmp/autonomous-loop-held-tasks ]; then
            echo "No task completed: durable completion state unchanged."
            exit 0
          fi
          if [ ! -s /tmp/minimal-autonomous-loop.jsonl ]; then
            echo "No loop result; state unchanged."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/minimal-autonomous-loop.jsonl')
          lines = [x for x in path.read_text(encoding='utf-8').splitlines() if x.strip()]
          results = [json.loads(line) for line in lines]
          if not results:
              raise SystemExit("no loop results")
          completed_ids = []
          for result in results:
              status = result.get("status", "FAIL")
              task_id = result.get("task_id", "")
              if status not in {"PASS", "NO_CHANGE"} or not task_id:
                  raise SystemExit(
                      f"State is not advanced: status={status} task_id={task_id}"
                  )
              if task_id not in completed_ids:
                  completed_ids.append(task_id)
          Path('/tmp/autonomous-completed-task-ids.json').write_text(
              json.dumps(completed_ids, ensure_ascii=False),
              encoding='utf-8',
          )
          print("Completed task IDs:", ", ".join(completed_ids))
          PY

          state_branch="autonomous-loop-state"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if ! git ls-remote --exit-code origin "refs/heads/$state_branch" >/dev/null 2>&1; then
            git push "$auth_url" "refs/remotes/origin/main:refs/heads/$state_branch"
          fi
          git fetch --quiet origin "$state_branch"
          rm -rf /tmp/autonomous-state-worktree
          git worktree add --detach /tmp/autonomous-state-worktree "origin/$state_branch"
          python - <<'PY'
          import json
          from pathlib import Path
          state_path = Path('/tmp/autonomous-state-worktree/.autonomous-loop-state.json')
          ids_path = Path('/tmp/autonomous-completed-task-ids.json')
          if state_path.exists():
              data = json.loads(state_path.read_text(encoding='utf-8'))
          else:
              data = {"version": 1, "completed": []}
          completed = data.get("completed", [])
          if not isinstance(completed, list):
              raise SystemExit("invalid durable state")
          task_ids = json.loads(ids_path.read_text(encoding='utf-8'))
          if not isinstance(task_ids, list) or not task_ids:
              raise SystemExit("invalid completed task IDs")
          for task_id in task_ids:
              if not isinstance(task_id, str) or not task_id:
                  raise SystemExit("invalid completed task ID")
              if task_id not in completed:
                  completed.append(task_id)
          data["completed"] = completed
          data["version"] = 1
          state_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
          PY
          git -C /tmp/autonomous-state-worktree config user.name "github-actions[bot]"
          git -C /tmp/autonomous-state-worktree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/autonomous-state-worktree add .autonomous-loop-state.json
          if git -C /tmp/autonomous-state-worktree diff --cached --quiet; then
            echo "Durable state already contains all completed task IDs."
          else
            git -C /tmp/autonomous-state-worktree commit -m "chore: record autonomous loop completion"
            git -C /tmp/autonomous-state-worktree push "$auth_url" HEAD:refs/heads/$state_branch
          fi

      - name: Persist Recovery AI durable state
        id: persist_recovery_ai
        if: ${{ !cancelled() && steps.run_task.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f /tmp/autonomous-loop-not-run ] || [ -f /tmp/autonomous-loop-held-tasks ]; then
            echo "No task ran; Recovery AI durable state remains unchanged."
            exit 0
          fi
          if [ ! -s /tmp/minimal-autonomous-loop.jsonl ] || [ ! -f /tmp/recovery-ai-state.json ]; then
            echo "::error::Recovery AI result/state evidence is missing."
            exit 1
          fi
          # Persist only allowlisted signal kinds, safe task IDs, and generic details.
          # Raw exception text and arbitrary model/user content never enter durable state.
          python scripts/self_improvement_state.py export \
            --state /tmp/autonomous-loop-state.json \
            --history /tmp/line-bot-self-improvement.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for line in Path('/tmp/minimal-autonomous-loop.jsonl').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  row = json.loads(line)
                  if not isinstance(row, dict):
                      raise SystemExit('invalid result evidence before Recovery AI persistence')
                  rows.append(row)
          if not rows:
              raise SystemExit('empty task evidence before Recovery AI persistence')
          if any(row.get('failure_reason') == 'recovery_ai_state_persist_failed' for row in rows):
              raise SystemExit('local Recovery AI persistence failed; durable update blocked')
          recovery = json.loads(Path('/tmp/recovery-ai-state.json').read_text(encoding='utf-8'))
          if (not isinstance(recovery, dict) or recovery.get('schema_version') != 1
                  or not isinstance(recovery.get('tasks'), dict) or 'checkpoint' not in recovery):
              raise SystemExit('invalid local Recovery AI state; durable update blocked')
          PY
          state_branch="autonomous-loop-state"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if ! git ls-remote --exit-code origin "refs/heads/$state_branch" >/dev/null 2>&1; then
            git push "$auth_url" "refs/remotes/origin/main:refs/heads/$state_branch"
          fi
          git fetch --quiet origin "$state_branch"
          rm -rf /tmp/recovery-ai-state-worktree
          git worktree add --detach /tmp/recovery-ai-state-worktree "origin/$state_branch"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/recovery-ai-state-worktree')
          state_path = root / '.autonomous-loop-state.json'
          recovery_path = Path('/tmp/recovery-ai-state.json')
          if state_path.exists():
              data = json.loads(state_path.read_text(encoding='utf-8'))
          else:
              data = {'version': 1, 'completed': []}
          if not isinstance(data, dict) or not isinstance(data.get('completed', []), list):
              raise SystemExit('durable loop state is invalid')
          recovery = json.loads(recovery_path.read_text(encoding='utf-8'))
          if (not isinstance(recovery, dict) or recovery.get('schema_version') != 1
                  or not isinstance(recovery.get('tasks'), dict) or 'checkpoint' not in recovery):
              raise SystemExit('Recovery AI schema is invalid')
          data['recovery_ai'] = recovery
          rag_payload = json.loads(Path('/tmp/recovery-rag-state.json').read_text(encoding='utf-8'))
          if (not isinstance(rag_payload, dict) or rag_payload.get('schema_version') != 1
                  or not isinstance(rag_payload.get('records'), list)
                  or len(rag_payload['records']) > 200):
              raise SystemExit('Recovery RAG export is invalid; durable update blocked')
          data['recovery_rag'] = rag_payload['records']
          local_state = json.loads(Path('/tmp/autonomous-loop-state.json').read_text(encoding='utf-8'))
          self_improvement = local_state.get('self_improvement_history', [])
          if not isinstance(self_improvement, list) or len(self_improvement) > 200:
              raise SystemExit('sanitized self-improvement history is invalid')
          for row in self_improvement:
              if (not isinstance(row, dict)
                      or row.get('kind') not in {'success', 'repair', 'failure'}
                      or row.get('detail') not in {
                          'development reached integration gate',
                          'development required repair attempts',
                          'development failure observed',
                      }):
                  raise SystemExit('self-improvement history failed schema validation')
          data['self_improvement_history'] = self_improvement
          data['version'] = 1
          state_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git -C /tmp/recovery-ai-state-worktree config user.name "github-actions[bot]"
          git -C /tmp/recovery-ai-state-worktree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/recovery-ai-state-worktree add .autonomous-loop-state.json
          if git -C /tmp/recovery-ai-state-worktree diff --cached --quiet; then
            echo "Recovery AI durable state already matches the local state."
          else
            git -C /tmp/recovery-ai-state-worktree commit -m "chore: persist Recovery AI task outcomes"
            git -C /tmp/recovery-ai-state-worktree push "$auth_url" HEAD:refs/heads/$state_branch
          fi
          git fetch --quiet origin "$state_branch"
          git show "origin/$state_branch:.autonomous-loop-state.json" > /tmp/recovery-ai-state-readback.json
          python - <<'PY'
          import json
          from pathlib import Path
          durable = json.loads(Path('/tmp/recovery-ai-state-readback.json').read_text(encoding='utf-8'))
          expected = json.loads(Path('/tmp/recovery-ai-state.json').read_text(encoding='utf-8'))
          if durable.get('recovery_ai') != expected:
              raise SystemExit('Recovery AI durable read-back mismatch')
          rag_payload = json.loads(Path('/tmp/recovery-rag-state.json').read_text(encoding='utf-8'))
          if durable.get('recovery_rag') != rag_payload.get('records'):
              raise SystemExit('Recovery RAG durable read-back mismatch')
          local_state = json.loads(Path('/tmp/autonomous-loop-state.json').read_text(encoding='utf-8'))
          if durable.get('self_improvement_history') != local_state.get('self_improvement_history'):
              raise SystemExit('self-improvement durable read-back mismatch')
          print('Recovery AI, RAG, and sanitized self-improvement durable state read-back verified.')
          PY

      - name: Record distributed run result to Google Sheets
        id: sheets
        if: always()
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          AUTONOMOUS_DEV_LEDGER_RANGE: ${{ secrets.AUTONOMOUS_DEV_LEDGER_RANGE || 'AutonomousDevelopment!A:ZZ' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          DEV_INSTRUCTION: Distributed autonomous loop scheduled task
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LOOP_OUTCOME: ${{ steps.run_task.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STATE_OUTCOME: ${{ steps.persist_state.outcome }}
          RECOVERY_OUTCOME: ${{ steps.persist_recovery_ai.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export AUTONOMOUS_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export AUTONOMOUS_START_SHA="${AUTONOMOUS_START_SHA:-$GITHUB_SHA}"
          export AUTONOMOUS_PRODUCED_SHA="$(git rev-parse HEAD 2>/dev/null || printf '%s' "$GITHUB_SHA")"
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            export AUTONOMOUS_CHANGED_FILES="$(git diff --name-only "$AUTONOMOUS_START_SHA" "$AUTONOMOUS_PRODUCED_SHA" | paste -sd, -)"
          else
            export AUTONOMOUS_CHANGED_FILES=""
          fi
          export AUTONOMOUS_SOURCE="distributed-loop"
          export AUTONOMOUS_AGENT="DistributedAutonomousLoop"
          export AUTONOMOUS_PR_URL=""
          echo "Google Sheets ledger target: ${AUTONOMOUS_DEV_LEDGER_RANGE}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results_path = Path('/tmp/minimal-autonomous-loop.jsonl')
          rows = []
          if results_path.exists():
              for line in results_path.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      try:
                          value = json.loads(line)
                          if isinstance(value, dict):
                              rows.append(value)
                      except json.JSONDecodeError:
                          pass
          result = rows[-1] if rows else {}
          status = str(result.get('status') or '')
          task_id = str(result.get('task_id') or '')
          run_outcome = os.getenv('LOOP_OUTCOME', '')
          publish = os.getenv('PUBLISH_OUTCOME', '')
          state = os.getenv('STATE_OUTCOME', '')
          recovery = os.getenv('RECOVERY_OUTCOME', '')

          not_run = os.path.exists('/tmp/autonomous-loop-not-run')
          held_tasks = os.path.exists('/tmp/autonomous-loop-held-tasks')
          if not_run:
              status = 'NOT_RUN'
          elif held_tasks:
              status = 'BLOCKED'
          elif status not in {'PASS', 'NO_CHANGE', 'FAIL', 'BLOCKED'}:
              status = 'BLOCKED' if not result or status in {'STOPPED', 'TIMEOUT'} else 'FAIL'
          if not_run:
              os.environ['AUTONOMOUS_TASK_ID'] = ''
              os.environ['DEV_INSTRUCTION'] = 'Queue exhausted; no task executed; replenish the task queue.'
          elif held_tasks:
              os.environ['AUTONOMOUS_TASK_ID'] = ''
              os.environ['DEV_INSTRUCTION'] = 'All pending tasks are held; human review is required before resume.'
          else:
              os.environ['AUTONOMOUS_TASK_ID'] = task_id or 'distributed-loop-no-task-result'
              os.environ['DEV_INSTRUCTION'] = str(result.get('summary') or result.get('task_summary') or os.environ['DEV_INSTRUCTION'])
          os.environ['AUTONOMOUS_TESTS_RESULT'] = status
          if status == 'NOT_RUN':
              os.environ['AUTONOMOUS_VERIFICATION_RESULT'] = 'NOT_RUN'
              os.environ['AUTONOMOUS_SAFETY_GATE_RESULT'] = 'NOT_RUN'
          elif held_tasks:
              os.environ['AUTONOMOUS_VERIFICATION_RESULT'] = 'NOT_RUN'
              os.environ['AUTONOMOUS_SAFETY_GATE_RESULT'] = 'BLOCKED'
          else:
              os.environ['AUTONOMOUS_VERIFICATION_RESULT'] = 'PASS' if publish == 'success' else ('NOT_RUN' if publish == 'skipped' else 'FAIL')
              os.environ['AUTONOMOUS_SAFETY_GATE_RESULT'] = 'PASS' if status in {'PASS', 'NO_CHANGE'} and run_outcome == 'success' and publish == 'success' and state == 'success' and recovery == 'success' else 'BLOCKED'
          os.environ['AUTONOMOUS_MERGE_RESULT'] = 'NOT_AUTO_MERGED'
          reason = str(result.get('failure_reason') or '')
          if held_tasks:
              reason = 'all_pending_tasks_held'
          if not reason and status not in {'PASS', 'NO_CHANGE'}:
              reason = f"loop_{status.lower()}" if result else f"workflow_failed_before_result:{run_outcome or 'not_run'}"
          if not reason and publish not in {'success', 'skipped'}:
              reason = f'publish_{publish or "not_run"}'
          if not reason and state not in {'success', 'skipped'}:
              reason = f'state_persistence_{state or "not_run"}'
          os.environ['AUTONOMOUS_BLOCKED_FAILED_REASON'] = reason
          if status == 'PASS' and run_outcome == 'success' and publish == 'success' and state == 'success':
              action = 'review_changes'
          elif status == 'NO_CHANGE':
              action = 'none'
          elif status == 'NOT_RUN':
              action = 'replenish_task_queue'
          elif held_tasks:
              action = 'review_held_tasks'
          else:
              action = 'inspect_workflow_run'
          os.environ['AUTONOMOUS_NEXT_ACTION'] = action

          from agents.sheets.autonomous_ledger import record_autonomous_run
          try:
              recorded = record_autonomous_run()
          except Exception as exc:
              error_text = f"{type(exc).__name__}: {exc}"
              os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'] = 'ERROR'
              Path('/tmp/distributed-sheets-log-result.json').write_text(
                  json.dumps({
                      'run_id': os.environ.get('GITHUB_RUN_ID', ''),
                      'task_id': os.environ.get('AUTONOMOUS_TASK_ID', ''),
                      'result': 'ERROR',
                      'error_type': type(exc).__name__,
                      'error': str(exc),
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print(f'distributed run Sheets ledger result: ERROR: {error_text}')
              raise
          else:
              os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'] = 'RECORDED' if recorded else 'ALREADY_RECORDED'
              print(f'distributed run Sheets ledger result: {os.environ["AUTONOMOUS_SHEETS_LOG_RESULT"]}')
              Path('/tmp/distributed-sheets-log-result.json').write_text(
                  json.dumps({
                      'run_id': os.environ.get('GITHUB_RUN_ID', ''),
                      'task_id': os.environ.get('AUTONOMOUS_TASK_ID', ''),
                      'result': os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'],
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Build final distributed loop report
        if: always()
        env:
          MAX_TASKS: ${{ env.MAX_TASKS }}
          LOOP_OUTCOME: ${{ steps.run_task.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STATE_OUTCOME: ${{ steps.persist_state.outcome }}
          RECOVERY_OUTCOME: ${{ steps.persist_recovery_ai.outcome }}
          SHEETS_OUTCOME: ${{ steps.sheets.outcome }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ github.event_name == 'issue_comment' && github.event.issue.number || github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          requested="${MAX_TASKS:-4}"
          completed=0
          if [ -s /tmp/minimal-autonomous-loop.jsonl ]; then
            completed="$(python -c 'import json; from pathlib import Path; print(sum(1 for line in Path("/tmp/minimal-autonomous-loop.jsonl").read_text(encoding="utf-8").splitlines() if line.strip() and isinstance(json.loads(line), dict) and json.loads(line).get("status") in {"PASS","NO_CHANGE"}))')"
          fi
          if progress_json="$(python -m scripts.distributed_loop_queue_progress \
            --queue "${AUTONOMOUS_LOOP_TASK_QUEUE:-.github/autonomous-loop-tasks.json}" \
            --state /tmp/autonomous-loop-state.json \
            --results /tmp/minimal-autonomous-loop.jsonl)"; then
            queue_total="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["queue_total"])' "$progress_json")"
            queue_completed="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["queue_completed"])' "$progress_json")"
            export QUEUE_PROGRESS_INVALID=false
          else
            echo "::error::Queue progress evidence invalid; final outcome will be BLOCKED."
            queue_total=0
            queue_completed=0
            export QUEUE_PROGRESS_INVALID=true
          fi
          export REQUESTED_TASKS="$requested"
          export QUEUE_COMPLETED="$queue_completed"
          export QUEUE_TOTAL="$queue_total"
          if outcome_json="$(python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from scripts.run_minimal_autonomous_loop import classify_final_outcome

          statuses = []
          path = Path("/tmp/minimal-autonomous-loop.jsonl")
          if path.exists():
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if isinstance(row, dict):
                      statuses.append(str(row.get("status") or ""))
          queue_empty = Path("/tmp/autonomous-loop-not-run").exists()
          # The loop exits 78 without writing a result row when its queue is empty.
          # Normalize that explicit sentinel into the classifier's documented evidence.
          if queue_empty and not statuses:
              statuses = ["NOT_RUN"]
          try:
              if os.getenv("QUEUE_PROGRESS_INVALID", "").lower() == "true":
                  outcome, reason = "BLOCKED", "queue_progress_evidence_invalid"
              else:
                  outcome, reason = classify_final_outcome(
                      statuses,
                      loop_outcome=os.getenv("LOOP_OUTCOME", ""),
                      publish_outcome=os.getenv("PUBLISH_OUTCOME", ""),
                      state_outcome=os.getenv("STATE_OUTCOME", ""),
                      sheets_outcome=os.getenv("SHEETS_OUTCOME", ""),
                      recovery_outcome=os.getenv("RECOVERY_OUTCOME", ""),
                      queue_empty=queue_empty,
                      all_tasks_held=Path("/tmp/autonomous-loop-held-tasks").exists(),
                      requested_tasks=int(os.getenv("REQUESTED_TASKS", "4")),
                      queue_completed=int(os.getenv("QUEUE_COMPLETED", "0")),
                      queue_total=int(os.getenv("QUEUE_TOTAL", "0")),
                  )
          except Exception as exc:
              # Do not leak exception messages or environment data into the report.
              print(f"Final outcome classifier failed: {type(exc).__name__}", file=sys.stderr)
              raise
          print(json.dumps({"outcome": outcome, "reason": reason}))
          PY
          )"; then
            result="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["outcome"])' "$outcome_json")"
            result_reason="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["reason"])' "$outcome_json")"
          else
            result="BLOCKED"
            result_reason="final_outcome_classifier_failed"
            echo "::error::Final outcome classifier failed; result is BLOCKED. See Python error class above."
          fi
          produced_sha="$(git rev-parse HEAD 2>/dev/null || echo "${GITHUB_SHA}")"
          {
            echo "# 分散Loop 終了報告"
            echo
            echo "- 結果: **$result**"
            echo "- 結果理由: $result_reason"
            echo "- 今回の実行タスク: ${completed}/${requested}"
            echo "- キュー進捗: ${queue_completed}/${queue_total}"
            echo "- 最終SHA: ${produced_sha}"
            echo "- Task実行: ${LOOP_OUTCOME:-not_run}"
            echo "- Publish: ${PUBLISH_OUTCOME:-not_run}"
            echo "- State: ${STATE_OUTCOME:-not_run}"
            echo "- Recovery AI state: ${RECOVERY_OUTCOME:-not_run}"
            echo "- Sheets: ${SHEETS_OUTCOME:-not_run}"
            echo "- Job: ${JOB_STATUS:-unknown}"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "### Task別結果"
            if [ "$result" = "NOT_RUN" ]; then
              echo "(NOT_RUN: タスクは1件も実行されていません。理由: ${result_reason}。キューは ${queue_completed}/${queue_total} で、未完了Taskがありません。タスクの補充が必要です。)"
            elif [ "$result" = "BLOCKED" ] && [ -f /tmp/autonomous-loop-held-tasks ]; then
              echo "(BLOCKED: 未完了Taskはすべて安全上の保留状態です。自動再実行せず、人による原因修正と再開確認が必要です。)"
            fi
            if [ -s /tmp/minimal-autonomous-loop.jsonl ]; then
              cat /tmp/minimal-autonomous-loop.jsonl
            elif [ "$result" = "NOT_RUN" ]; then
              :
            else
              echo "(結果なし: Task結果ファイルが生成されませんでした。)"
            fi
          } | tee /tmp/distributed-final-report.txt >> "$GITHUB_STEP_SUMMARY"

          if { [ "${GITHUB_EVENT_NAME}" = "issue_comment" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; } && [ -n "${PR_NUMBER:-}" ] && command -v gh >/dev/null 2>&1; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/distributed-final-report.txt || true
          fi

          # A BLOCKED report must fail the source workflow too. Otherwise workflow_run
          # consumers may see conclusion=success and trust the Sheets artifact despite
          # invalid queue-progress evidence.
          if [ "${QUEUE_PROGRESS_INVALID:-false}" = "true" ]; then
            echo "::error::Distributed Loop blocked: queue progress evidence is invalid."
            exit 1
          fi

      - name: Wake Render before LINE final report
        if: always()
        run: |
          set -euo pipefail
          # Free Render instances may need time to wake after inactivity.
          # Retry only the harmless health check; do not repeat the task or push request.
          if ! curl --fail-with-body --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors --max-time 30 \
            "https://line-bot-yvea.onrender.com/health"; then
            echo "::warning::Render health warm-up failed; continuing to the single LINE push attempt."
          fi
      - name: Notify LINE of distributed loop final report
        if: always()
        env:
          LINE_INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          DISTRIBUTED_LOOP_LINE_USER_ID: ${{ secrets.DISTRIBUTED_LOOP_LINE_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${LINE_INTERNAL_PUSH_KEY:-}" ] || [ -z "${DISTRIBUTED_LOOP_LINE_USER_ID:-}" ]; then
            echo "LINE success notification skipped: required GitHub secrets are not configured."
            exit 0
          fi
          # Every completed distributed-loop run must send its final report to LINE,
          # including queue-exhausted runs, so LINE remains the authoritative user-facing status.
          if [ -s /tmp/distributed-final-report.txt ]; then
            message="$(cat /tmp/distributed-final-report.txt)"
          else
            message="⚠️ 分散Loop終了報告を生成できませんでした。Run #${{ github.run_number }}"
          fi
          export MESSAGE="$message"
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({'user_id': os.environ['DISTRIBUTED_LOOP_LINE_USER_ID'], 'message': os.environ['MESSAGE']}, ensure_ascii=False))
          PY
          )"
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "https://line-bot-yvea.onrender.com/internal/push" \
            -H "Content-Type: application/json" \
            -H "x-internal-key: ${LINE_INTERNAL_PUSH_KEY}" \
            --data "$payload"
      - name: Upload durable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-autonomous-loop-${{ github.run_id }}
          retention-days: 30
          path: |
            /tmp/minimal-autonomous-loop.jsonl
            /tmp/autonomous-loop-state.json
            /tmp/recovery-ai-state.json
            /tmp/recovery-ai-state-readback.json
            /tmp/autonomous-*.json
            /tmp/distributed-sheets-log-result.json
            /tmp/distributed-final-report.txt
          if-no-files-found: ignore

