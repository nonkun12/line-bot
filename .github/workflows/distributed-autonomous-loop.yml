name: Distributed Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Manual run task limit (1-3)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
  schedule:
    - cron: '30 4 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 12 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 20 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: distributed-autonomous-loop
  cancel-in-progress: false

jobs:
  distributed-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      SELF_IMPROVEMENT_POLICY_ENFORCED: 'true'
      HERMES_ADVISOR_ENABLED: 'true'
      GOOGLE_SHEETS_AUDIT_ENABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Load loop task queue
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.github/autonomous-loop-tasks.json').read_text(encoding='utf-8'))
          configured_max = int(data.get('max_tasks_per_run', 3))
          requested_raw = "${{ inputs.max_tasks }}"
          requested_max = int(requested_raw) if requested_raw.isdigit() else configured_max
          max_tasks = max(1, min(requested_max, configured_max, 3))
          tasks = data.get('tasks', [])[:max_tasks]
          if not tasks: raise SystemExit('Autonomous loop task queue is empty.')
          Path('/tmp/loop_tasks.json').write_text(json.dumps(tasks, ensure_ascii=False), encoding='utf-8')
          print(f'Loaded {len(tasks)} task(s).')
          PY

      - name: Run distributed development loop
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEV_USER_ID: autonomous-distributed-loop
          GITHUB_RUN_ID: ${{ github.run_id }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_AUDIT_RANGE: ${{ secrets.GOOGLE_SHEETS_AUDIT_RANGE }}
          SELF_IMPROVEMENT_HISTORY_PATH: /tmp/line-bot-self-improvement.jsonl
        run: |
          set +e
          executed=0; succeeded=0; blocked=0
          : > /tmp/distributed_loop_results.jsonl
          while IFS= read -r task; do
            id="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$task")"
            instruction="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["instruction"])' "$task")"
            echo "LOOP TASK ${id}"
            export DEV_INSTRUCTION="$instruction"
            export AUTONOMOUS_SUMMARY_PATH="/tmp/autonomous-${id}.json"
            python scripts/run_guarded_runtime.py
            rc=$?
            executed=$((executed + 1))
            status="FAIL"
            if [ -f "$AUTONOMOUS_SUMMARY_PATH" ]; then
              status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status","FAIL"))' "$AUTONOMOUS_SUMMARY_PATH")"
            fi
            if [ "$rc" -eq 0 ]; then succeeded=$((succeeded + 1)); else blocked=$((blocked + 1)); fi
            printf '%s\n' "$(python -c 'import json,sys; print(json.dumps({"task_id":sys.argv[1],"status":sys.argv[2],"exit_code":int(sys.argv[3])}, ensure_ascii=False))' "$id" "$status" "$rc")" >> /tmp/distributed_loop_results.jsonl
            echo "Task ${id}: status=${status}, exit=${rc}"
          done < <(python -c 'import json; [print(json.dumps(x,ensure_ascii=False)) for x in json.load(open("/tmp/loop_tasks.json",encoding="utf-8"))]')
          echo "LOOP_EXECUTED=${executed}"
          echo "LOOP_SUCCEEDED=${succeeded}"
          echo "LOOP_BLOCKED=${blocked}"
          # Validated no-op is success. If every attempted task is blocked/failed,
          # fail closed so the scheduled run is visible as unhealthy.
          if [ "$executed" -gt 0 ] && [ "$succeeded" -eq 0 ]; then
            echo "FAIL_CLOSED=all attempted tasks were blocked or failed"
            exit 1
          fi
          exit 0

      - name: Publish one reviewable PR when a loop branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="line-dev/$GITHUB_RUN_ID"
          if ! git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "No autonomous branch was produced; no PR."
            exit 0
          fi
          git fetch origin "$branch"
          git diff --check "main...origin/$branch"
          if gh pr view --head "$branch" --base main >/dev/null 2>&1; then
            echo "PR already exists for $branch"
          else
            set +e
            pr_output="$(gh pr create --base main --head "$branch" --draft --title "chore: distributed autonomous loop $GITHUB_RUN_ID" --body "Distributed autonomous development loop. Common guarded runtime, tests, review/integration gates, and Sheets audit are required. No automatic merge or deploy." 2>&1)"
            pr_rc=$?
            set -e
            if [ "$pr_rc" -eq 0 ]; then
              echo "$pr_output"
              echo "PR_CREATE_RESULT=created"
            else
              echo "$pr_output"
              echo "PR_CREATE_RESULT=blocked"
              echo "GitHub Actions is not permitted to create pull requests in this repository."
              echo "Enable the repository setting 'Allow GitHub Actions to create and approve pull requests' or provide an approved alternate PR credential."
              echo "The autonomous branch remains published for review: $branch"
            fi
          fi

      - name: Upload loop results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-loop-${{ github.run_id }}
          path: |
            /tmp/distributed_loop_results.jsonl
            /tmp/autonomous-*.json
          if-no-files-found: ignore