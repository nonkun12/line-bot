name: Distributed Autonomous Development Loop

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Manual run task limit (1 only for MVP)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
  # ChatGPT can request a bounded one-task run by creating an authorized PR comment.
  # The job remains fail-closed and max-tasks is hard-coded to 1 for this trigger.
  issue_comment:
    types: [created]
  schedule:
    - cron: '30 4 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 10 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 16 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 22 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: write

concurrency:
  group: distributed-autonomous-loop
  cancel-in-progress: false

jobs:
  minimal-loop:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.body == '/distributed-loop' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      SELF_IMPROVEMENT_POLICY_ENFORCED: 'true'
      HERMES_ADVISOR_ENABLED: 'true'
      DEV_USER_ID: autonomous-distributed-loop
      GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout without persistent git credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record distributed run base commit
        run: echo "AUTONOMOUS_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check remote kill switch
        run: |
          if [ -f .autonomous-loop.stop ]; then
            echo "REMOTE_KILL_SWITCH=ON"
            exit 1
          fi

      - name: Load durable loop state
        run: |
          set -euo pipefail
          rm -f /tmp/autonomous-loop-state.json
          if git ls-remote --exit-code origin refs/heads/autonomous-loop-state >/dev/null 2>&1; then
            git fetch --quiet origin autonomous-loop-state
            git show origin/autonomous-loop-state:.autonomous-loop-state.json > /tmp/autonomous-loop-state.json
          else
            printf '%s\n' '{"version":1,"completed":[]}' > /tmp/autonomous-loop-state.json
          fi
          python -m json.tool /tmp/autonomous-loop-state.json >/dev/null

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run one bounded autonomous task
        id: run_task
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          SELF_IMPROVEMENT_HISTORY_PATH: /tmp/line-bot-self-improvement.jsonl
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          : > /tmp/minimal-autonomous-loop.jsonl
          STOP_FILE=/tmp/line-bot-autonomous-loop.stop

          (
            while sleep 15; do
              if git fetch --quiet origin main 2>/dev/null && git cat-file -e FETCH_HEAD:.autonomous-loop.stop 2>/dev/null; then
                touch "$STOP_FILE"
                exit 0
              fi
            done
          ) &
          POLLER_PID=$!
          trap 'kill "$POLLER_PID" 2>/dev/null || true' EXIT

          python scripts/run_minimal_autonomous_loop.py \
            --max-tasks 1 \
            --stop-file "$STOP_FILE" \
            --state /tmp/autonomous-loop-state.json \
            --results /tmp/minimal-autonomous-loop.jsonl

      - name: Publish verified development branch
        id: publish
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="line-dev/$GITHUB_RUN_ID"
          head="$(git rev-parse HEAD)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "No development commit was produced; nothing to publish."
            exit 0
          fi
          git diff --check "$GITHUB_SHA...HEAD"
          git diff --name-only "$GITHUB_SHA...HEAD"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          git push --set-upstream "$auth_url" "HEAD:refs/heads/$branch"
          echo "PUBLISHED_BRANCH=$branch"
          echo "PUBLISHED_SHA=$head"

      - name: Persist completed task state
        id: persist_state
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/minimal-autonomous-loop.jsonl ]; then
            echo "No loop result; state unchanged."
            exit 0
          fi

          status="$(python - <<'PY'
          import json
          from pathlib import Path
          lines = [x for x in Path('/tmp/minimal-autonomous-loop.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          print(json.loads(lines[-1]).get('status', 'FAIL'))
          PY
          )"
          task_id="$(python - <<'PY'
          import json
          from pathlib import Path
          lines = [x for x in Path('/tmp/minimal-autonomous-loop.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          print(json.loads(lines[-1]).get('task_id', ''))
          PY
          )"

          if [[ "$status" != "PASS" && "$status" != "NO_CHANGE" ]] || [ -z "$task_id" ]; then
            echo "State is not advanced: status=$status task_id=$task_id"
            exit 1
          fi

          state_branch="autonomous-loop-state"
          auth_url="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if ! git ls-remote --exit-code origin "refs/heads/$state_branch" >/dev/null 2>&1; then
            git push "$auth_url" "refs/remotes/origin/main:refs/heads/$state_branch"
          fi
          git fetch --quiet origin "$state_branch"
          rm -rf /tmp/autonomous-state-worktree
          git worktree add --detach /tmp/autonomous-state-worktree "origin/$state_branch"
          python - "$task_id" <<'PY'
          import json, sys
          from pathlib import Path
          p = Path('/tmp/autonomous-state-worktree/.autonomous-loop-state.json')
          if p.exists():
              data = json.loads(p.read_text(encoding='utf-8'))
          else:
              data = {"version": 1, "completed": []}
          completed = data.get("completed", [])
          if not isinstance(completed, list):
              raise SystemExit("invalid durable state")
          task_id = sys.argv[1]
          if task_id not in completed:
              completed.append(task_id)
          data["completed"] = completed
          data["version"] = 1
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding='utf-8')
          PY
          git -C /tmp/autonomous-state-worktree config user.name "github-actions[bot]"
          git -C /tmp/autonomous-state-worktree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/autonomous-state-worktree add .autonomous-loop-state.json
          if git -C /tmp/autonomous-state-worktree diff --cached --quiet; then
            echo "State already contains task $task_id"
          else
            git -C /tmp/autonomous-state-worktree commit -m "chore: record autonomous loop completion"
            git -C /tmp/autonomous-state-worktree push "$auth_url" HEAD:refs/heads/$state_branch
          fi

      - name: Record distributed run result to Google Sheets
        if: always()
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          DEV_INSTRUCTION: Distributed autonomous loop scheduled task
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          LOOP_OUTCOME: ${{ steps.run_task.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          STATE_OUTCOME: ${{ steps.persist_state.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export AUTONOMOUS_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export AUTONOMOUS_START_SHA="${AUTONOMOUS_START_SHA:-$GITHUB_SHA}"
          export AUTONOMOUS_PRODUCED_SHA="$(git rev-parse HEAD 2>/dev/null || printf '%s' "$GITHUB_SHA")"
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            export AUTONOMOUS_CHANGED_FILES="$(git diff --name-only "$AUTONOMOUS_START_SHA" "$AUTONOMOUS_PRODUCED_SHA" | paste -sd, -)"
          else
            export AUTONOMOUS_CHANGED_FILES=""
          fi
          export AUTONOMOUS_SOURCE="distributed-loop"
          export AUTONOMOUS_AGENT="DistributedAutonomousLoop"
          export AUTONOMOUS_PR_URL=""
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          results_path = Path('/tmp/minimal-autonomous-loop.jsonl')
          rows = []
          if results_path.exists():
              for line in results_path.read_text(encoding='utf-8').splitlines():
                  if line.strip():
                      try:
                          value = json.loads(line)
                          if isinstance(value, dict):
                              rows.append(value)
                      except json.JSONDecodeError:
                          pass
          result = rows[-1] if rows else {}
          status = str(result.get('status') or '')
          task_id = str(result.get('task_id') or '')
          run_outcome = os.getenv('LOOP_OUTCOME', '')
          publish = os.getenv('PUBLISH_OUTCOME', '')
          state = os.getenv('STATE_OUTCOME', '')

          if status not in {'PASS', 'NO_CHANGE', 'FAIL', 'BLOCKED'}:
              status = 'BLOCKED' if not result or status in {'STOPPED', 'TIMEOUT'} else 'FAIL'
          os.environ['AUTONOMOUS_TASK_ID'] = task_id or 'distributed-loop-no-task-result'
          os.environ['DEV_INSTRUCTION'] = str(result.get('summary') or result.get('task_summary') or os.environ['DEV_INSTRUCTION'])
          os.environ['AUTONOMOUS_TESTS_RESULT'] = status
          os.environ['AUTONOMOUS_VERIFICATION_RESULT'] = 'PASS' if publish == 'success' else ('NOT_RUN' if publish == 'skipped' else 'FAIL')
          os.environ['AUTONOMOUS_SAFETY_GATE_RESULT'] = 'PASS' if status in {'PASS', 'NO_CHANGE'} and run_outcome == 'success' and publish == 'success' and state == 'success' else 'BLOCKED'
          os.environ['AUTONOMOUS_MERGE_RESULT'] = 'NOT_AUTO_MERGED'
          reason = str(result.get('failure_reason') or '')
          if not reason and status not in {'PASS', 'NO_CHANGE'}:
              reason = f"loop_{status.lower()}" if result else f"workflow_failed_before_result:{run_outcome or 'not_run'}"
          if not reason and publish not in {'success', 'skipped'}:
              reason = f'publish_{publish or "not_run"}'
          if not reason and state not in {'success', 'skipped'}:
              reason = f'state_persistence_{state or "not_run"}'
          os.environ['AUTONOMOUS_BLOCKED_FAILED_REASON'] = reason
          if status == 'PASS' and run_outcome == 'success' and publish == 'success' and state == 'success':
              action = 'review_changes'
          elif status == 'NO_CHANGE':
              action = 'none'
          else:
              action = 'inspect_workflow_run'
          os.environ['AUTONOMOUS_NEXT_ACTION'] = action

          from agents.sheets.autonomous_ledger import record_autonomous_run
          try:
              recorded = record_autonomous_run()
          except Exception as exc:
              error_text = f"{type(exc).__name__}: {exc}"
              os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'] = 'ERROR'
              Path('/tmp/distributed-sheets-log-result.json').write_text(
                  json.dumps({
                      'run_id': os.environ.get('GITHUB_RUN_ID', ''),
                      'task_id': os.environ.get('AUTONOMOUS_TASK_ID', ''),
                      'result': 'ERROR',
                      'error_type': type(exc).__name__,
                      'error': str(exc),
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
              print(f'distributed run Sheets ledger result: ERROR: {error_text}')
              raise
          else:
              os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'] = 'RECORDED' if recorded else 'ALREADY_RECORDED'
              print(f'distributed run Sheets ledger result: {os.environ["AUTONOMOUS_SHEETS_LOG_RESULT"]}')
              Path('/tmp/distributed-sheets-log-result.json').write_text(
                  json.dumps({
                      'run_id': os.environ.get('GITHUB_RUN_ID', ''),
                      'task_id': os.environ.get('AUTONOMOUS_TASK_ID', ''),
                      'result': os.environ['AUTONOMOUS_SHEETS_LOG_RESULT'],
                  }, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Notify LINE of successful distributed loop
        if: success()
        env:
          LINE_INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          DISTRIBUTED_LOOP_LINE_USER_ID: ${{ secrets.DISTRIBUTED_LOOP_LINE_USER_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${LINE_INTERNAL_PUSH_KEY:-}" ] || [ -z "${DISTRIBUTED_LOOP_LINE_USER_ID:-}" ]; then
            echo "LINE success notification skipped: required GitHub secrets are not configured."
            exit 0
          fi
          task_id="distributed-loop-no-task-result"
          status="PASS"
          if [ -s /tmp/minimal-autonomous-loop.jsonl ]; then
            task_id="$(python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/minimal-autonomous-loop.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          print(rows[-1].get('task_id') or 'distributed-loop-no-task-result')
          PY
            )"
            status="$(python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/minimal-autonomous-loop.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          print(rows[-1].get('status') or 'PASS')
          PY
            )"
          fi
          produced_sha="$(git rev-parse HEAD)"
          message="✅ 分散Loop SUCCESS\nRun #${{ github.run_number }}\nTask: $task_id\nStatus: $status\nSHA: $produced_sha\n${RUN_URL}"
          export MESSAGE="$message"
          payload="$(python - <<'PY'
          import json, os
          print(json.dumps({'user_id': os.environ['DISTRIBUTED_LOOP_LINE_USER_ID'], 'message': os.environ['MESSAGE']}, ensure_ascii=False))
          PY
          )"
          curl --fail-with-body --silent --show-error --max-time 15 \
            -X POST "https://line-bot-yvea.onrender.com/internal/push" \
            -H "Content-Type: application/json" \
            -H "x-internal-key: ${LINE_INTERNAL_PUSH_KEY}" \
            --data "$payload"
      - name: Upload durable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minimal-autonomous-loop-${{ github.run_id }}
          retention-days: 30
          path: |
            /tmp/minimal-autonomous-loop.jsonl
            /tmp/autonomous-loop-state.json
            /tmp/autonomous-*.json
            /tmp/distributed-sheets-log-result.json
          if-no-files-found: ignore

