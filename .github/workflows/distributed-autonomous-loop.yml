name: Distributed Autonomous Development Loop
run-name: Distributed Loop (continuation_depth=${{ inputs.continuation_depth || '0' }}, request_id=${{ inputs.request_id || 'scheduled' }})

on:
  workflow_dispatch:
    inputs:
      max_tasks:
        description: 'Manual run task limit (fixed at one task per run)'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
      request_id:
        description: 'Optional correlation ID for a LINE-queued request'
        required: false
        default: ''
        type: string
      continuation_depth:
        description: 'Internal continuation counter; the loop continues only while every cycle passes safety gates and tasks remain'
        required: false
        default: '0'
        type: string
      mode:
        description: 'Run mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - 'normal'
          - 'obsidian_incident'
      incident_category:
        description: 'Allowlisted Obsidian incident category'
        required: false
        default: 'vault_write_failed'
        type: choice
        options:
          - 'local_job_failed'
          - 'vault_write_failed'
      incident_detail:
        description: 'Allowlisted exception class (not raw error text)'
        required: false
        default: 'PermissionError'
        type: choice
        options:
          - 'OSError'
          - 'PermissionError'
          - 'FileNotFoundError'
          - 'IsADirectoryError'
          - 'NotADirectoryError'
          - 'RuntimeError'
          - 'ValueError'
          - 'TypeError'
          - 'KeyError'
          - 'AttributeError'
          - 'UnicodeDecodeError'
      incident_job_id:
        description: 'Numeric Obsidian job ID; no note content'
        required: false
        type: string
      resume_task_id:
        description: 'Resume exactly one held task after its cause is fixed'
        required: false
        default: ''
        type: string
      confirm_cause_fixed:
        description: 'Confirm that the selected task failure cause has been fixed'
        required: false
        default: false
        type: boolean
      confirm_resume_review:
        description: 'Confirm that the resumed task has been reviewed and may re-enter the queue'
        required: false
        default: false
        type: boolean
  # ChatGPT can request a bounded run by creating an authorized PR comment.
  # The trigger is fixed to one task and remains fail-closed.
  issue_comment:
    types: [created]
  # Reliable fallback trigger for ChatGPT: adding this exact label to a PR.
  # pull_request_target executes the workflow from the default branch, not PR code.
  pull_request_target:
    types: [labeled]
  schedule:
    # Single scheduler: every 30 minutes (JST). Side workflows are not independently scheduled.
    - cron: '*/30 * * * *'
      timezone: 'Asia/Tokyo'

# Default-deny write access for every job; jobs must opt into narrowly scoped permissions.
permissions:
  actions: read
  contents: read

concurrency:
  group: distributed-autonomous-loop
  cancel-in-progress: false
  # Preserve multiple requests instead of replacing the latest pending run.
  # LINE dispatch is separately capped at two outstanding runs.
  queue: max

jobs:
  safety-preflight:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (github.event.comment.body == '/distributed-loop' ||
         github.event.comment.body == '/distributed-loop max_tasks=1' ||
                                    startsWith(github.event.comment.body, '/distributed-loop resume_task_id=')) &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      ) ||
      (
        github.event_name == 'pull_request_target' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'distributed-loop-max1' &&
        github.event.sender.login == 'nonkun12' &&
        github.event.pull_request.user.login == 'nonkun12'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # The preflight only reads Actions metadata and durable state; never grant the worker's write token here.
    permissions:
      actions: read
      contents: read
    outputs:
      execution_enabled: ${{ steps.preflight.outputs.execution_enabled }}
    steps:
      - name: Checkout without persistent git credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # No approval/budget secrets are exposed while the worker is permanently inert.
      - name: Read-only activation preflight
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ORCA_STATE_BRANCH: ${{ vars.ORCA_STATE_BRANCH || 'orca-state' }}
          ORCA_STATE_PATH: ${{ vars.ORCA_STATE_PATH || 'state/queue.json' }}
        run: python -m scripts.orca_30m_preflight

  # Deliberately inert until the typed worker, trusted budget evidence,
  # durable approval consumption, and independent STOP checks are integrated.
  # Do not restore the legacy runner or its notification/publishing side effects here.
  minimal-loop:
    needs: safety-preflight
    if: ${{ needs.safety-preflight.outputs.execution_enabled == 'true' && false }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      actions: read
      contents: read
    env:
      MAX_TASKS: '1'
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      FREE_ONLY_EXECUTION_APPROVED: 'false'
      HERMES_ADVISOR_ENABLED: 'false'
      SELF_IMPROVEMENT_CREATOR_CRITIC: 'false'
    steps:
      - name: Keep unified LOOP execution disabled
        run: |
          echo "BLOCKED: executable worker is not integrated; no legacy runtime or external side effects are permitted."
