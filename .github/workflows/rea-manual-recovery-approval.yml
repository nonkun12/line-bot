name: REA Recovery Approval - Dispatch One Safe Loop

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Merged recovery PR number to verify"
        required: true
        type: string
      confirmation:
        description: "Type APPROVE-REA-RECOVERY to authorize one fresh Loop dispatch"
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: rea-manual-recovery-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  verify-and-dispatch:
    # Explicit owner approval is required; this does not approve task execution.
    if: >-
      github.actor == 'nonkun12' &&
      inputs.confirmation == 'APPROVE-REA-RECOVERY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merged PR identity and target
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "BLOCKED: pr_number must be a positive integer."
            exit 1
          fi
          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > pr.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          pr = json.loads(Path("pr.json").read_text(encoding="utf-8"))
          if pr.get("merged") is not True:
              raise SystemExit("BLOCKED: target PR is not merged.")
          if (pr.get("base") or {}).get("ref") != "main":
              raise SystemExit("BLOCKED: target PR was not merged into main.")
          if (pr.get("user") or {}).get("login") != "nonkun12":
              raise SystemExit("BLOCKED: target PR author is not the repository owner.")
          sha = pr.get("merge_commit_sha")
          if not sha:
              raise SystemExit("BLOCKED: merge commit SHA is missing.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"merge_sha={sha}\n")
          print(f"Verified merged PR #{pr['number']} at {sha}.")
          PY

      - name: Verify all merge commit checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/commits/${MERGE_SHA}/check-runs" > checks.json
          python - <<'PY'
          import json
          from pathlib import Path
          checks = json.loads(Path("checks.json").read_text(encoding="utf-8")).get("check_runs", [])
          if not checks:
              raise SystemExit("BLOCKED: no check-run evidence exists.")
          bad = [
              (x.get("name", "unknown"), x.get("status"), x.get("conclusion"))
              for x in checks
              if x.get("status") != "completed" or x.get("conclusion") not in {"success", "skipped"}
          ]
          if bad or not any(x.get("conclusion") == "success" for x in checks):
              raise SystemExit(f"BLOCKED: checks are not clean: {bad[:20]}")
          print(f"Verified {len(checks)} completed checks.")
          PY

      - name: Refuse overlapping Distributed Loop runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/workflows/distributed-autonomous-loop.yml/runs?per_page=100" > runs.json
          python - <<'PY'
          import json
          from pathlib import Path
          runs = json.loads(Path("runs.json").read_text(encoding="utf-8")).get("workflow_runs", [])
          active = [
              (x.get("id"), x.get("status"), x.get("event"))
              for x in runs
              if x.get("status") in {"queued", "in_progress", "waiting", "requested"}
          ]
          if active:
              raise SystemExit(f"BLOCKED: a Distributed Loop is already active: {active[:10]}")
          PY

      - name: Dispatch exactly one fresh Loop with task execution denied
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          MERGE_SHA: ${{ steps.pr.outputs.merge_sha }}
        run: |
          set -euo pipefail
          REQUEST_ID="$(python - <<'PY'
          import hashlib, os
          value = f"rea-manual-recovery:{os.environ['PR_NUMBER']}:{os.environ['MERGE_SHA']}"
          print(hashlib.sha256(value.encode()).hexdigest()[:32])
          PY
          )"
          gh workflow run distributed-autonomous-loop.yml --repo "${REPOSITORY}" --ref main \
            -f execution_approval=DENY \
            -f max_tasks=1 \
            -f request_id="${REQUEST_ID}"
          echo "Dispatched one Loop; execution_approval=DENY; max_tasks=1."
          echo "Task-level authorization and HOLD gates remain unchanged."
