name: ORCA D1 Worker source checks

on:
  pull_request:
    paths:
      - "cloudflare/orca-test-api/**"
      - ".github/workflows/orca-d1-worker-source-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker JavaScript syntax
        run: node --check cloudflare/orca-test-api/src/index.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run SQLite migration contract tests
        run: python -m unittest discover -s cloudflare/orca-test-api/tests -v

      - name: Run ORCA Budget Guardian simulated-environment tests
        run: node --test cloudflare/orca-test-api/tests/*.test.mjs

      - name: Install Wrangler for isolated local D1 integration tests
        run: npm install --global wrangler@4

      - name: Run Worker against temporary local D1
        env:
          ORCA_D1_INTEGRATION: "1"
        run: python cloudflare/orca-test-api/tests/test_worker_d1_integration.py -v
