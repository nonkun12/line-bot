name: Nightly Development Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/nightly_development_test.py'
      - '.github/workflows/nightly-test.yml'
  schedule:
    - cron: '0 18 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run safe nightly test
        run: python scripts/nightly_development_test.py
