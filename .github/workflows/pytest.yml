name: Pytest

on:
  push:
    branches:
      - main
      - feat/ai-core-phase2-dynamic-graph-20260910

  pull_request:
    branches:
      - main
      - fix/integrated-regression-20260909
      - feat/ai-platform-core-20260909


jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt




      - name: Run pytest
        run: |
          echo "Running pytest..."
          pytest -v 2>&1 | tee pytest_output.log
          exit ${PIPESTATUS[0]}

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest_output.log
          retention-days: 7
