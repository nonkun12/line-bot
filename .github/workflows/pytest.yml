name: Pytest

on:
  # Run the full test suite for code changes on development branches too,
  # not only after a PR is opened or changes reach main.
  push:
    branches:
      - '**'
    paths:
      - '*.py'
      - '**/*.py'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'tox.ini'
      - '.github/workflows/pytest.yml'

  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          echo "Running pytest..."
          pytest -v 2>&1 | tee pytest_output.log

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest_output.log
          retention-days: 7
