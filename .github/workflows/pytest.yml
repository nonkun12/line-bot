name: Pytest

on:
  # Run the full test suite for code changes on development branches too,
  # not only after a PR is opened or changes reach main.
  push:
    branches:
      - '**'
    paths:
      - '*.py'
      - '**/*.py'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'pyproject.toml'
      - 'tox.ini'
      - 'tests/fixtures/rag_retrieval_eval.json'
      - '.github/workflows/pytest.yml'

  # Stacked feature-branch PRs must also run the full suite.
  pull_request:


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify production pytest sandbox boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux
          command -v bwrap
          command -v prlimit
          python -m pytest -q tests/test_autonomous_test_sandbox.py

      - name: Generate offline RAG retrieval benchmark
        run: |
          python -m scripts.evaluate_rag_retrieval > rag_retrieval_benchmark.json
          python -m json.tool rag_retrieval_benchmark.json >/dev/null

      - name: Upload RAG retrieval benchmark
        if: always() && hashFiles('rag_retrieval_benchmark.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rag-retrieval-benchmark
          path: rag_retrieval_benchmark.json
          retention-days: 14

      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          echo "Running pytest..."
          pytest -v 2>&1 | tee pytest_output.log

      - name: Upload pytest log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest_output.log
          retention-days: 7
