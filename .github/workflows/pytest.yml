name: Pytest

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check MCP URL
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
        run: |

          echo "===== MCP URL ====="
          echo "$MCP_SERVER_URL"

          echo "===== MCP HOST ====="
          HOST=$(echo "$MCP_SERVER_URL" | sed 's#https://##' | cut -d/ -f1)
          echo "$HOST"


          echo "===== DNS CHECK ====="
          nslookup "$HOST" || true


          echo "===== CURL CHECK ====="
          curl -I "https://$HOST" || true



      - name: Run pytest
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}

        run: |

          echo "Running pytest..."

          pytest -v