name: REA Isolated Tests

on:
  pull_request:
    paths:
      - "core/rea_artifact_evaluator.py"
      - "core/rea_independent_test_evidence.py"
      - "scripts/rea_independent_collector.py"
      - "tests/test_rea_artifact_evaluator.py"
      - "tests/test_rea_independent_test_evidence.py"
      - "tests/test_rea_independent_collector.py"
      - ".github/workflows/rea-isolated-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rea-isolated-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  focused-rea-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build a minimal trusted test image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rea-test-image"
          cat > "$RUNNER_TEMP/rea-test-image/Dockerfile" <<'EOF'
          FROM python:3.12-slim
          RUN python -m pip install --no-cache-dir pytest==8.3.5
          WORKDIR /workspace
          USER 65532:65532
          EOF
          docker build --pull -t rea-isolated-tests:local "$RUNNER_TEMP/rea-test-image"

      - name: Run focused REA tests with no network, secrets, or writable source
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/rea-source"
          runner="$RUNNER_TEMP/rea-runner.py"
          mkdir -p "$source_dir"
          git archive --format=tar HEAD | tar -xf - -C "$source_dir"
          cat > "$runner" <<'PY'
          import sys, types
          import pytest
          core_package = types.ModuleType("core")
          core_package.__path__ = ["/workspace/core"]
          sys.modules["core"] = core_package
          scripts_package = types.ModuleType("scripts")
          scripts_package.__path__ = ["/workspace/scripts"]
          sys.modules["scripts"] = scripts_package
          sys.path.insert(0, "/workspace")
          raise SystemExit(pytest.main([
              "-q", "-p", "no:cacheprovider", "--noconftest",
              "/workspace/tests/test_rea_artifact_evaluator.py",
              "/workspace/tests/test_rea_independent_test_evidence.py",
              "/workspace/tests/test_rea_independent_collector.py",
          ]))
          PY
          timeout --signal=TERM --kill-after=10s 8m docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m,uid=65532,gid=65532 \
            --mount "type=bind,src=$source_dir,dst=/workspace,readonly" \
            --mount "type=bind,src=$runner,dst=/runner.py,readonly" \
            --workdir /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            --memory 2g \
            --cpus 2 \
            --user 65532:65532 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            rea-isolated-tests:local \
            python /runner.py
