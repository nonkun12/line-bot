name: LINE Continuation Context Tests

on:
  pull_request:
    paths:
      - "core/line_development_context.py"
      - "tests/test_line_development_context.py"
      - "line_development.py"
      - ".github/workflows/line-continuation-context-test.yml"

permissions:
  contents: read

concurrency:
  group: line-continuation-context-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  context-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run continuation context tests
        run: pytest -q tests/test_line_development_context.py
