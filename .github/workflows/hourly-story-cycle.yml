name: Hourly Story Cycle

on:
  schedule:
    # 23:00 JST first run, then hourly (GitHub cron is UTC).
    - cron: "0 14-23,0-13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: hourly-story-cycle
  cancel-in-progress: false

jobs:
  process-one-approved-story-job:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git

      - name: Execute one approved Goal child JOB
        env:
          INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUTONOMOUS_PUBLISH_VIA_WORKFLOW: "true"
          SELF_IMPROVEMENT_POLICY_ENFORCED: "true"
          AUTO_APPLY_PATCH: "false"
          AUTO_DEPLOY: "false"
        run: python -m scripts.goal_job_remote_worker
