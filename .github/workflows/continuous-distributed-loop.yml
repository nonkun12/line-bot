name: Continuous Distributed Loop

# Automatic recursive dispatch is disabled during consolidation.
# This workflow remains available only for a manual status check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-status:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain the current stop condition
        run: |
          echo "Automatic continuation is disabled."
          echo "A future activation requires verified worker, budget, approval, STOP, and independent-review gates."
