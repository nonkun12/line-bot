name: LINE Development Dispatch

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "Explicit development instruction from LINE"
        required: true
        type: string
      user_id:
        description: "LINE user ID"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: line-development-${{ github.event.inputs.user_id }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run bounded multi-agent LINE development runtime
        id: development
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${DEV_INSTRUCTION}" == *E2E* && "${DEV_INSTRUCTION}" == *テスト* ]] || [[ "${DEV_INSTRUCTION}" == *本線E2E* ]]; then
            echo "E2E test-only instruction detected; bypassing autonomous file-edit planning."
            echo "test_only=true" >> "$GITHUB_OUTPUT"
            python -m pytest -q --tb=native
          else
            echo "test_only=false" >> "$GITHUB_OUTPUT"
            python -m core.line_development_runtime
          fi

      - name: Create or reuse GitHub PR through Render
        id: create_pr
        if: ${{ steps.development.outputs.test_only != 'true' }}
        env:
          INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          BRANCH: line-dev/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Runtime completed without pushing ${BRANCH}; treating this as a no-change success."
            exit 0
          fi

          python - <<'PY'
          import json, os, urllib.request
          key = os.environ.get("INTERNAL_PUSH_KEY", "")
          if not key:
              raise SystemExit("INTERNAL_PUSH_KEY is not configured")
          payload = json.dumps({
              "head": os.environ["BRANCH"],
              "title": "feat: LINE development request",
              "body": (
                  "## LINE development request\n\n"
                  + os.environ["DEV_INSTRUCTION"]
                  + "\n\nUser: `" + os.environ["DEV_USER_ID"]
                  + "`\n\nMulti-agent runtime: Manager → Implementer → Tester → Reviewer → Repairer(if needed) → Integrator.\n\nGuarded tests and integration gate: PASS."
              ),
              "repository": os.environ.get("GITHUB_REPOSITORY", "nonkun12/line-bot"),
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://line-bot-yvea.onrender.com/internal/create-pr",
              data=payload,
              headers={"Content-Type": "application/json", "x-internal-key": key},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              result = response.read().decode("utf-8", errors="replace")
              print(f"Render create-pr HTTP {response.status}: {result}")
              data = json.loads(result)
              if not data.get("ok"):
                  raise SystemExit(f"PR creation failed: {data}")
          PY

      - name: Notify Slack of development result
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEVELOPMENT_OUTCOME: ${{ steps.development.outcome }}
          TEST_ONLY: ${{ steps.development.outputs.test_only }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          webhook = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          if not webhook:
              raise SystemExit(0)
          outcome = os.environ.get("DEVELOPMENT_OUTCOME", "unknown")
          instruction = os.environ.get("DEV_INSTRUCTION", "")
          run_url = os.environ.get("RUN_URL", "")
          test_only = os.environ.get("TEST_ONLY") == "true"
          if outcome == "success" and test_only:
              text = "✅ *本線E2Eテスト完了*\n" f"指示: {instruction}\n" "E2E専用経路でpytestを実行し成功しました。\n" f"GitHub Actions: {run_url}"
          elif outcome == "success":
              text = "✅ *AI自動開発 完了*\n" f"指示: {instruction}\n" "Manager → Implementer → Tester → Reviewer → Integrator を実行しました。\n" f"GitHub Actions: {run_url}"
          else:
              text = "❌ *AI自動開発 失敗*\n" f"指示: {instruction}\n" f"失敗地点: GitHub Actions（{outcome}）\n" f"詳細: {run_url}"
          request = urllib.request.Request(webhook, data=json.dumps({"text": text}).encode("utf-8"), headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
              print(response.status)
          PY

      - name: Notify LINE of development result
        if: always()
        env:
          INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEVELOPMENT_OUTCOME: ${{ steps.development.outcome }}
          TEST_ONLY: ${{ steps.development.outputs.test_only }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          key = os.environ.get("INTERNAL_PUSH_KEY", "")
          if not key:
              raise SystemExit(0)
          outcome = os.environ.get("DEVELOPMENT_OUTCOME", "unknown")
          instruction = os.environ.get("DEV_INSTRUCTION", "")
          run_url = os.environ.get("RUN_URL", "")
          test_only = os.environ.get("TEST_ONLY") == "true"
          if outcome == "success" and test_only:
              message = "✅ 本線E2Eテストが完了しました。\n" f"指示: {instruction}\n" "E2E専用経路でpytestを実行し、成功しました。\n" f"実行結果: {run_url}"
          elif outcome == "success":
              message = "✅ 自動開発が完了しました。\n" f"指示: {instruction}\n" "Manager → Implementer → Tester → Reviewer → Integrator を実行しました。\n" f"実行結果: {run_url}"
          else:
              message = "❌ 自動開発が失敗しました。\n" f"指示: {instruction}\n" f"失敗地点: GitHub Actions（{outcome}）\n" f"詳細: {run_url}"
          payload = json.dumps({"user_id": os.environ["DEV_USER_ID"], "message": message}).encode("utf-8")
          request = urllib.request.Request("https://line-bot-yvea.onrender.com/internal/push", data=payload, headers={"Content-Type": "application/json", "x-internal-key": key}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(response.status)
          except urllib.error.HTTPError as exc:
              print(f"LINE notification failed: HTTP {exc.code}: {exc.read().decode('utf-8', errors='replace')}")
          PY
