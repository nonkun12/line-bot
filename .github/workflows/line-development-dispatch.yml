name: LINE Development Dispatch

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: "Explicit development instruction from LINE"
        required: true
        type: string
      user_id:
        description: "LINE user ID"
        required: true
        type: string
      loop_count:
        description: "Sequential safe development passes (1-4)"
        required: false
        default: "4"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: line-development-${{ github.event.inputs.user_id }}
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Record development starting commit
        run: echo "AUTONOMOUS_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run bounded multi-agent LINE development runtime
        id: development
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/line-development-loop.log
          # Only an explicitly test-only request may bypass the autonomous runtime.
          # Implementation requests remain on the development path even when they
          # mention E2E, tests, or pytest as acceptance criteria.
          if [[ "${DEV_INSTRUCTION}" =~ ^[[:space:]]*(本線E2Eテストを実行|E2Eテストを実行|pytestを実行|pytestのみを実行) ]]; then
            echo "E2E test-only instruction detected; running pytest without autonomous file-edit planning."
            echo "test_only=true" >> "$GITHUB_OUTPUT"
            python -m pytest -q --tb=native
          else
            echo "test_only=false" >> "$GITHUB_OUTPUT"
            loop_count="${{ github.event.inputs.loop_count || '4' }}"
            case "$loop_count" in
              1|2|3|4) ;;
              *) echo "invalid loop_count=$loop_count" >&2; exit 1 ;;
            esac
            for loop_index in $(seq 1 "$loop_count"); do
              echo "LINE_DEVELOPMENT_LOOP=RUN index=${loop_index}/${loop_count}" | tee -a /tmp/line-development-loop.log
              export AUTONOMOUS_LOOP_INDEX="$loop_index"
              export AUTONOMOUS_LOOP_TOTAL="$loop_count"
              python -m scripts.run_guarded_runtime
              echo "LINE_DEVELOPMENT_LOOP=PASS index=${loop_index}/${loop_count}" | tee -a /tmp/line-development-loop.log
            done
          fi

      - name: Build final LINE development report
        if: always()
        env:
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          LOOP_COUNT: ${{ github.event.inputs.loop_count || '4' }}
          DEVELOPMENT_OUTCOME: ${{ steps.development.outcome }}
          TEST_ONLY: ${{ steps.development.outputs.test_only }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          completed=0
          if [ -f /tmp/line-development-loop.log ]; then
            completed=$(grep -c 'LINE_DEVELOPMENT_LOOP=PASS' /tmp/line-development-loop.log 2>/dev/null || true)
          fi
          requested="${LOOP_COUNT:-4}"
          outcome="${DEVELOPMENT_OUTCOME:-unknown}"
          if [ "${TEST_ONLY:-false}" = "true" ]; then
            title="本線E2Eテスト終了報告"
            result="${outcome}"
            detail="E2E専用経路でpytestを実行"
          elif [ "$outcome" = "success" ]; then
            title="AI自動開発 終了報告"
            result="COMPLETED"
            detail="${completed}/${requested} 回を正常完了"
          else
            title="AI自動開発 停止報告"
            result="STOPPED/FAILED"
            detail="${completed}/${requested} 回完了後に停止"
          fi
          {
            echo "# $title"
            echo
            echo "- 結果: **$result**"
            echo "- 詳細: $detail"
            echo "- 指示: ${DEV_INSTRUCTION}"
            echo "- ループ: ${completed}/${requested}"
            echo "- 実行: ${RUN_URL}"
            echo
            echo "### 実行ログ"
            if [ -s /tmp/line-development-loop.log ]; then cat /tmp/line-development-loop.log; else echo "(ループログなし)"; fi
          } | tee /tmp/line-development-final-report.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Create or reuse GitHub PR
        id: create_pr
        if: ${{ steps.development.outputs.test_only != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          BRANCH: line-dev/${{ github.run_id }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "Development worker did not push ${BRANCH}; preserving failure." >&2
            exit 1
          fi
          if gh pr view "${BRANCH}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url' 2>/dev/null; then
            echo "PR already exists for ${BRANCH}."
            exit 0
          fi
          cat <<EOF > /tmp/pr_body.md
          ## LINE development request

          ${DEV_INSTRUCTION}

          User: \`${DEV_USER_ID}\`

          Multi-agent runtime: Manager → Implementer → Tester → Reviewer → Repairer(if needed) → Integrator

          Guarded tests and integration gate: PASS
          Created directly by GitHub Actions.
          EOF
          gh pr create --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --base main --title "feat: LINE development request" --body-file /tmp/pr_body.md >/tmp/pr_url.txt
          cat /tmp/pr_url.txt

      - name: Record on-demand development result to Google Sheets
        if: always() && steps.development.outputs.test_only != 'true'
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          AUTONOMOUS_DEV_LEDGER_RANGE: ${{ secrets.AUTONOMOUS_DEV_LEDGER_RANGE }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export AUTONOMOUS_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export AUTONOMOUS_PRODUCED_SHA="$(git rev-parse HEAD)"
          export AUTONOMOUS_CHANGED_FILES="$(git diff --name-only "$AUTONOMOUS_START_SHA" "$AUTONOMOUS_PRODUCED_SHA" | paste -sd, -)"
          export AUTONOMOUS_SOURCE="on-demand"
          export AUTONOMOUS_AGENT="DistributedDevelopmentRuntime"
          export AUTONOMOUS_TASK_ID="on-demand-line-development"
          if [ "${{ steps.development.outcome }}" = "success" ]; then
            export AUTONOMOUS_TESTS_RESULT="PASS"
            export AUTONOMOUS_SAFETY_GATE_RESULT="PASS"
          else
            export AUTONOMOUS_TESTS_RESULT="FAIL"
            export AUTONOMOUS_SAFETY_GATE_RESULT="BLOCKED"
            export AUTONOMOUS_BLOCKED_FAILED_REASON="development_runtime_failed"
          fi
          export AUTONOMOUS_VERIFICATION_RESULT="NOT_RUN"
          export AUTONOMOUS_MERGE_RESULT="NOT_AUTO_MERGED"
          export AUTONOMOUS_NEXT_ACTION="review_pr"
          export AUTONOMOUS_PR_URL="$(gh pr view "line-dev/${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url' 2>/dev/null || true)"
          python - <<'PY'
          from agents.sheets.autonomous_ledger import record_autonomous_run
          record_autonomous_run()
          print("on-demand development result recorded to Google Sheets")
          PY

      - name: Notify Slack of development result
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEVELOPMENT_OUTCOME: ${{ steps.development.outcome }}
          TEST_ONLY: ${{ steps.development.outputs.test_only }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          webhook = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          if not webhook:
              print("SLACK_NOTIFICATION=SKIPPED (SLACK_WEBHOOK_URL is not configured)")
              raise SystemExit(1)
          outcome = os.environ.get("DEVELOPMENT_OUTCOME", "unknown")
          instruction = os.environ.get("DEV_INSTRUCTION", "")
          run_url = os.environ.get("RUN_URL", "")
          test_only = os.environ.get("TEST_ONLY") == "true"
          try:
              with open("/tmp/line-development-final-report.txt", encoding="utf-8") as fh:
                  message = fh.read()
          except OSError:
              message = "⚠️ 終了報告生成失敗\\n" f"指示: {instruction}\\n" f"実行結果: {run_url}\\n" f"Outcome: {outcome}"
          request = urllib.request.Request(webhook, data=json.dumps({"text": text}).encode("utf-8"), headers={"Content-Type": "application/json"}, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
              print(f"SLACK_NOTIFICATION=HTTP_{response.status}")
          PY

      - name: Notify LINE of development result
        if: always()
        env:
          INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          DEV_USER_ID: ${{ github.event.inputs.user_id }}
          DEV_INSTRUCTION: ${{ github.event.inputs.instruction }}
          DEVELOPMENT_OUTCOME: ${{ steps.development.outcome }}
          TEST_ONLY: ${{ steps.development.outputs.test_only }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          key = os.environ.get("INTERNAL_PUSH_KEY", "")
          if not key: raise SystemExit(0)
          outcome = os.environ.get("DEVELOPMENT_OUTCOME", "unknown")
          instruction = os.environ.get("DEV_INSTRUCTION", "")
          run_url = os.environ.get("RUN_URL", "")
          test_only = os.environ.get("TEST_ONLY") == "true"
          if outcome == "success" and test_only:
              message = "✅ 本線E2Eテストが完了しました。\n" f"指示: {instruction}\n" "E2E専用経路でpytestを実行し、成功しました。\n" f"実行結果: {run_url}"
          elif outcome == "success":
              message = "✅ 自動開発が完了しました。\n" f"指示: {instruction}\n" "Manager → Implementer → Tester → Reviewer → Integrator を実行しました。\n" f"実行結果: {run_url}"
          else:
              message = "❌ 自動開発が失敗しました。\n" f"指示: {instruction}\n" f"失敗地点: GitHub Actions（{outcome}）\n" f"詳細: {run_url}"
          payload = json.dumps({"user_id": os.environ["DEV_USER_ID"], "message": message}).encode("utf-8")
          request = urllib.request.Request("https://line-bot-yvea.onrender.com/internal/push", data=payload, headers={"Content-Type": "application/json", "x-internal-key": key}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=20) as response: print(response.status)
          except urllib.error.HTTPError as exc:
              print(f"LINE notification failed: HTTP {exc.code}: {exc.read().decode('utf-8', errors='replace')}")
          PY
