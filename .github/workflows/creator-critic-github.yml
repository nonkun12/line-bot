name: GitHub-hosted Creator-Critic discussion

on:
  push:
    branches:
      - "feat/local-bonsai-creator-critic-20261024"
    paths:
      - ".github/workflows/creator-critic-github.yml"
      - "scripts/run_creator_critic_github.py"
      - "scripts/creator_critic_loop_advisory.py"
      - "scripts/run_creator_critic_loop_advisory.py"
      - "tests/test_creator_critic_github_runner.py"
      - "tests/test_creator_critic_loop_advisory.py"
      - "tests/test_creator_critic_loop_workflow_integration.py"
  pull_request:
    paths:
      - ".github/workflows/creator-critic-github.yml"
      - "scripts/run_creator_critic_github.py"
      - "scripts/creator_critic_loop_advisory.py"
      - "scripts/run_creator_critic_loop_advisory.py"
      - "tests/test_creator_critic_github_runner.py"
      - "tests/test_creator_critic_loop_advisory.py"
      - "tests/test_creator_critic_loop_workflow_integration.py"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Creator/Critic rounds (1-3)"
        required: false
        default: "2"
        type: choice
        options: ["1", "2", "3"]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: github-hosted-creator-critic
  cancel-in-progress: false

jobs:
  discuss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Creator-Critic unit and orchestration tests
        run: |
          python -m unittest \
            tests.test_creator_critic_github_runner \
            tests.test_creator_critic_loop_advisory \
            tests.test_creator_critic_loop_workflow_integration -v

      - name: Install CPU inference dependencies
        if: github.event_name != 'pull_request'
        run: |
          python -m pip install --upgrade pip
          CMAKE_ARGS="-DGGML_NATIVE=OFF" python -m pip install "llama-cpp-python==0.3.16" "huggingface-hub==0.35.3"

      - name: Run bounded Creator-Critic discussion
        if: github.event_name != 'pull_request'
        env:
          DISCUSSION_ROUNDS: ${{ inputs.rounds || '2' }}
        run: |
          python scripts/run_creator_critic_github.py \
            --rounds "$DISCUSSION_ROUNDS" \
            --output artifacts/creator-critic-github/latest.json

      - name: Print actual Creator-Critic transcript for verification
        if: success() && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/creator-critic-github/latest.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          print("=== CREATOR_CRITIC_TRANSCRIPT_BEGIN ===")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print("=== CREATOR_CRITIC_TRANSCRIPT_END ===")
          assert report.get("status") == "DISCUSSION_ONLY"
          # The runner measures runtime/turn metadata, not the effectiveness of proposals.
          assert report.get("evidence_status") == "RUNTIME_MEASURED"
          assert report.get("improvement_effectiveness") == "NOT_MEASURED"
          assert len(report.get("transcript", [])) == report.get("rounds", 0) * 2
          assert all(item.get("content", "").strip() for item in report["transcript"])
          PY

      - name: Upload discussion transcript
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: creator-critic-github-${{ github.run_id }}
          path: artifacts/creator-critic-github/
          if-no-files-found: warn
          retention-days: 14
