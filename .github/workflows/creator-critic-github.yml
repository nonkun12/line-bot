name: GitHub-hosted Creator-Critic discussion

on:
  pull_request:
    paths:
      - ".github/workflows/creator-critic-github.yml"
      - "scripts/run_creator_critic_github.py"
      - "tests/test_creator_critic_github_runner.py"
  workflow_dispatch:
    inputs:
      rounds:
        description: "Creator/Critic rounds (1-3)"
        required: false
        default: "2"
        type: choice
        options: ["1", "2", "3"]
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: github-hosted-creator-critic
  cancel-in-progress: false

jobs:
  discuss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          CMAKE_ARGS="-DGGML_NATIVE=OFF" python -m pip install "llama-cpp-python==0.3.16" "huggingface-hub==0.35.3"

      - name: Run bounded Creator-Critic discussion
        env:
          DISCUSSION_ROUNDS: ${{ inputs.rounds || '2' }}
        run: |
          python scripts/run_creator_critic_github.py \
            --rounds "$DISCUSSION_ROUNDS" \
            --output artifacts/creator-critic-github/latest.json

      - name: Upload discussion transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-critic-github-${{ github.run_id }}
          path: artifacts/creator-critic-github/
          if-no-files-found: warn
          retention-days: 14
