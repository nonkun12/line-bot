name: AI Debug Agent

on:
  workflow_run:
    workflows: ["Pytest"]
    types:
      - completed

jobs:
  debug-agent:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download pytest failure log
        uses: actions/download-artifact@v4
        with:
          name: pytest-log
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifact

      - name: Write result to Actions Summary
        run: |
          {
            echo "## 🔍 AI Debug Agent (Phase A-1: log passthrough only)"
            echo ""
            echo "Pytest failed on commit \`${{ github.event.workflow_run.head_sha }}\`."
            echo ""
            echo '```'
            cat ./artifact/pytest_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
