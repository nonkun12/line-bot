name: AI Debug Agent

on:
  workflow_run:
    workflows: ["Pytest"]
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  debug-agent:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted default-branch code only
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download pytest failure log
        uses: actions/download-artifact@v4
        with:
          name: pytest-log
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ./artifact

      - name: Analyze untrusted pytest log with trusted read-only analyzer
        env:
          FAILED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Pytest failed on commit ${FAILED_COMMIT_SHA}." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci_debug_trigger.py ./artifact/pytest_output.log >> "$GITHUB_STEP_SUMMARY"
