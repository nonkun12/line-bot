name: Distributed Loop 30-Minute Scheduler
run-name: Distributed Loop Scheduler (scheduler_run_id=${{ github.run_id }})

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Never accumulate a backlog of scheduled dispatchers.
concurrency:
  group: distributed-loop-30m-scheduler
  cancel-in-progress: false

jobs:
  dispatch-one-bounded-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CONTROL_TOWER_KILL_SWITCH: ${{ vars.CONTROL_TOWER_KILL_SWITCH || 'false' }}
    steps:
      - name: Checkout trusted main for stop-file check
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Stop when Control Tower or repository kill switch is active
        id: kill
        run: |
          set -euo pipefail
          if [ "${CONTROL_TOWER_KILL_SWITCH,,}" = "true" ] || [ -f .autonomous-loop.stop ]; then
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "decision=SKIPPED_KILL_SWITCH" >> "$GITHUB_OUTPUT"
            echo "kill_switch_active=true" >> "$GITHUB_OUTPUT"
            if [ "${CONTROL_TOWER_KILL_SWITCH,,}" = "true" ]; then
              echo "skip_reason=CONTROL_TOWER_KILL_SWITCH" >> "$GITHUB_OUTPUT"
            else
              echo "skip_reason=STOP_FILE" >> "$GITHUB_OUTPUT"
            fi
            echo "Scheduler stopped: kill switch is active." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify public repository and standard-runner billing scope
        id: budget
        if: steps.kill.outputs.dispatch == 'true'
        run: |
          set -euo pipefail
          visibility="$(gh api "repos/$REPOSITORY" --jq '.visibility')"
          if [ "$visibility" = "public" ]; then
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
            echo "Public repository + ubuntu-latest standard runner: no included Actions-minute budget is consumed; skipped expensive history scan." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "decision=SKIPPED_BILLING_GUARD" >> "$GITHUB_OUTPUT"
            echo "repository_visibility=$visibility" >> "$GITHUB_OUTPUT"
            echo "::warning::Repository is not public; refusing scheduled dispatch until a billing-scope-accurate guard is configured."
            echo "Private repository detected; no development run dispatched because repository-local job history is not an account-wide billing meter." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Avoid duplicate active distributed loops
        id: active
        if: steps.kill.outputs.dispatch == 'true' && steps.budget.outputs.dispatch == 'true'
        run: |
          set -euo pipefail
          active_record="$(gh api --paginate "repos/$REPOSITORY/actions/workflows/distributed-autonomous-loop.yml/runs?per_page=100" | jq -s '[.[] | .workflow_runs[]? | select(.status == "queued" or .status == "in_progress")] | sort_by(.created_at) | first // {}')"
          active_id="$(jq -r '.id // empty' <<< "$active_record")"
          if [ -n "$active_id" ]; then
            active_status="$(jq -r '.status // empty' <<< "$active_record")"
            echo "dispatch=false" >> "$GITHUB_OUTPUT"
            echo "decision=SKIPPED_ACTIVE_LOOP" >> "$GITHUB_OUTPUT"
            echo "active_loop_run_id=$active_id" >> "$GITHUB_OUTPUT"
            active_workflow_id="$(jq -r '.workflow_id // empty' <<< "$active_record")"
            active_created_at="$(jq -r '.created_at // empty' <<< "$active_record")"
            active_observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "active_loop_status_at_decision=$active_status" >> "$GITHUB_OUTPUT"
            echo "active_loop_workflow_id=$active_workflow_id" >> "$GITHUB_OUTPUT"
            echo "active_loop_created_at=$active_created_at" >> "$GITHUB_OUTPUT"
            echo "active_loop_observed_at=$active_observed_at" >> "$GITHUB_OUTPUT"
            echo "Existing distributed loop is queued/running; skipping this slot." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dispatch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch one-task distributed development cycle
        id: dispatch
        if: steps.kill.outputs.dispatch == 'true' && steps.budget.outputs.dispatch == 'true' && steps.active.outputs.dispatch == 'true'
        run: |
          set -euo pipefail
          request_id="$GITHUB_RUN_ID"
          gh workflow run distributed-autonomous-loop.yml \
            --repo "$REPOSITORY" --ref main \
            -f max_tasks=1 -f execution_approval=DENY \
            -f policy_dispatch=30m_scheduler -f request_id="$request_id"
          child_run_id=""
          for attempt in $(seq 1 12); do
            child_run_id="$(gh api --paginate "repos/$REPOSITORY/actions/workflows/distributed-autonomous-loop.yml/runs?per_page=100" | jq -sr --arg request_id "$request_id" '[.[] | .workflow_runs[]? | select((.display_title // .name // "") | contains("request_id=" + $request_id)) | .id][0] // empty' | head -n 1 || true)"
            if [ -n "$child_run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$child_run_id" ]; then
            echo "::error::Dispatch was accepted but the child Loop Run ID could not be confirmed."
            echo "DISPATCH_UNCONFIRMED request_id=$request_id" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "child_loop_run_id=$child_run_id" >> "$GITHUB_OUTPUT"
          {
            echo "- Scheduler Run ID: $GITHUB_RUN_ID"
            echo "- Request correlation ID: $request_id"
            echo "- Child Loop Run ID: $child_run_id"
            echo "- Child Loop URL: https://github.com/$REPOSITORY/actions/runs/$child_run_id"
            echo "- Execution approval: DENY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write machine-readable scheduler decision
        if: always()
        env:
          KILL_DECISION: ${{ steps.kill.outputs.decision }}
          KILL_REASON: ${{ steps.kill.outputs.skip_reason }}
          BILLING_DECISION: ${{ steps.budget.outputs.decision }}
          REPOSITORY_VISIBILITY: ${{ steps.budget.outputs.repository_visibility }}
          ACTIVE_DECISION: ${{ steps.active.outputs.decision }}
          ACTIVE_LOOP_RUN_ID: ${{ steps.active.outputs.active_loop_run_id }}
          ACTIVE_LOOP_STATUS: ${{ steps.active.outputs.active_loop_status_at_decision }}
          ACTIVE_LOOP_WORKFLOW_ID: ${{ steps.active.outputs.active_loop_workflow_id }}
          ACTIVE_LOOP_CREATED_AT: ${{ steps.active.outputs.active_loop_created_at }}
          ACTIVE_LOOP_OBSERVED_AT: ${{ steps.active.outputs.active_loop_observed_at }}
          KILL_SWITCH_ACTIVE: ${{ steps.kill.outputs.kill_switch_active }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          CHILD_LOOP_RUN_ID: ${{ steps.dispatch.outputs.child_loop_run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          decision = (
              os.environ.get("KILL_DECISION")
              or os.environ.get("BILLING_DECISION")
              or os.environ.get("ACTIVE_DECISION")
          )
          if not decision:
              decision = "DISPATCHED" if (
                  os.environ.get("DISPATCH_OUTCOME") == "success"
                  and os.environ.get("CHILD_LOOP_RUN_ID")
              ) else "DISPATCH_UNCONFIRMED"
          record = {
              "schema_version": 1,
              "scheduler_run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "decision": decision,
              "request_id": os.environ["GITHUB_RUN_ID"],
              "active_loop_run_id": os.environ.get("ACTIVE_LOOP_RUN_ID") or None,
              "active_loop_status_at_decision": os.environ.get("ACTIVE_LOOP_STATUS") or None,
              "active_loop_workflow_id": int(os.environ["ACTIVE_LOOP_WORKFLOW_ID"]) if os.environ.get("ACTIVE_LOOP_WORKFLOW_ID") else None,
              "active_loop_created_at": os.environ.get("ACTIVE_LOOP_CREATED_AT") or None,
              "active_loop_observed_at": os.environ.get("ACTIVE_LOOP_OBSERVED_AT") or None,
              "kill_switch_active": os.environ.get("KILL_SWITCH_ACTIVE") == "true",
              "child_loop_run_id": os.environ.get("CHILD_LOOP_RUN_ID") or None,
              "skip_reason": os.environ.get("KILL_REASON") or None,
              "repository_visibility": os.environ.get("REPOSITORY_VISIBILITY") or None,
              "execution_approval": "DENY",
              "policy_dispatch": "30m_scheduler",
              "head_sha": os.environ["GITHUB_SHA"],
              "created_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open("scheduler-decision.json", "w", encoding="utf-8") as handle:
              json.dump(record, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write(chr(10))
          print(json.dumps({"decision": decision, "scheduler_run_id": record["scheduler_run_id"]}))
          PY
          {
            echo "# 30-minute Distributed LOOP Scheduler"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Decision: $(python -c 'import json; print(json.load(open("scheduler-decision.json"))["decision"])')"
            echo "- Kill switch: ${CONTROL_TOWER_KILL_SWITCH}"
            echo "- Billing gate: public repository + standard ubuntu-latest runner required"
            echo "- Target task limit: 1"
            echo "- Execution approval: DENY"
            echo "- Merge/deploy: not performed by scheduler"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve scheduler decision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: scheduler-decision.json
          if-no-files-found: error
          retention-days: 14
