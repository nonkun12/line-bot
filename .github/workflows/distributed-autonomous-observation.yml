name: Distributed Autonomous Observation
run-name: Distributed Observation (read-only)

on:
  schedule:
    - cron: "0,30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: distributed-autonomous-observation
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Collect read-only repository signals
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${REPOSITORY}/issues?state=all&per_page=100" > /tmp/issues-pages.json
          gh api --paginate --slurp "repos/${REPOSITORY}/pulls?state=open&per_page=100" > /tmp/pulls-pages.json
          gh api --paginate --slurp "repos/${REPOSITORY}/actions/runs?per_page=50" > /tmp/runs-pages.json
          # Durable state is stored on its dedicated branch; fetch it through the
          # read-only Contents API because checkout intentionally persists no credentials.
          gh api "repos/${REPOSITORY}/contents/.autonomous-loop-state.json?ref=autonomous-loop-state" > /tmp/state-content.json
          python - <<'PY'
          import base64
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/state-content.json").read_text(encoding="utf-8"))
          encoded = payload.get("content")
          if not isinstance(encoded, str) or not encoded.strip():
              raise SystemExit("durable_state_content_missing")
          state_bytes = base64.b64decode("".join(encoded.split()), validate=True)
          state = json.loads(state_bytes.decode("utf-8"))
          recovery = state.get("recovery_ai") if isinstance(state, dict) else None
          if (
              not isinstance(state, dict)
              or not isinstance(state.get("completed"), list)
              or not isinstance(recovery, dict)
              or type(recovery.get("schema_version")) is not int
              or recovery.get("schema_version") != 1
              or not isinstance(recovery.get("tasks"), dict)
              or "checkpoint" not in recovery
          ):
              raise SystemExit("durable_state_invalid")
          Path("/tmp/autonomous-loop-state.json").write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          raw_pages = json.loads(Path("/tmp/issues-pages.json").read_text(encoding="utf-8"))
          issues = []
          for page in raw_pages:
              if isinstance(page, list):
                  issues.extend(
                      item for item in page
                      if isinstance(item, dict) and "pull_request" not in item
                  )
          Path("/tmp/autonomous-loop-all-issues.json").write_text(
              json.dumps(issues, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY
          python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path
          from datetime import datetime, timezone

          def pages(path, collection_key=None):
              raw = json.loads(Path(path).read_text(encoding="utf-8"))
              result = []
              for page in raw:
                  if isinstance(page, list):
                      result.extend(item for item in page if isinstance(item, dict))
                  elif isinstance(page, dict) and collection_key:
                      values = page.get(collection_key, [])
                      if isinstance(values, list):
                          result.extend(item for item in values if isinstance(item, dict))
              return result

          issues = [x for x in pages("/tmp/issues-pages.json") if "pull_request" not in x]
          pulls = pages("/tmp/pulls-pages.json")
          runs = pages("/tmp/runs-pages.json", "workflow_runs")
          queue = json.loads(Path(".github/autonomous-loop-tasks.json").read_text(encoding="utf-8"))
          catalog = json.loads(Path(".github/autonomous-loop-task-catalog.json").read_text(encoding="utf-8"))
          tasks = queue.get("tasks", [])
          registered = catalog.get("tasks", [])
          approved = [x for x in registered if isinstance(x, dict) and x.get("execution_approved") is True] if isinstance(registered, list) else []
          approval_candidates = [{
              "task_id": x.get("id"),
              "instruction_sha256": hashlib.sha256(str(x.get("instruction", "")).strip()[:2000].encode("utf-8")).hexdigest(),
              "allowed_paths": sorted(x.get("allowed_paths", [])) if isinstance(x.get("allowed_paths"), list) else [],
              "allowed_paths_sha256": hashlib.sha256(json.dumps(sorted(x.get("allowed_paths", [])), ensure_ascii=False, separators=(",", ":")).encode("utf-8")).hexdigest(),
          } for x in approved]
          report = {
              "observed_at": datetime.now(timezone.utc).isoformat(),
              "mode": "READ_ONLY",
              "repository": os.environ["REPOSITORY"],
              "base_sha": os.environ["GITHUB_SHA"],
              "kill_switch_local_marker": Path(".autonomous-loop.stop").exists(),
              "runtime_queue_count": len(tasks) if isinstance(tasks, list) else None,
              "catalog_count": len(registered) if isinstance(registered, list) else None,
              "catalog_execution_approved_count": len(approved),
              "approval_candidates": approval_candidates,
              "open_issues_count": sum(1 for x in issues if x.get("state") == "open"),
              "closed_issues_count": sum(1 for x in issues if x.get("state") == "closed"),
              "open_pull_requests_count": len(pulls),
              "recent_workflow_runs": [{
                  "name": x.get("name"), "event": x.get("event"),
                  "status": x.get("status"), "conclusion": x.get("conclusion"),
                  "run_number": x.get("run_number"), "html_url": x.get("html_url")
              } for x in runs[:20]],
              "safety_boundary": "No repository, issue, branch, PR, workflow, or durable-state writes are performed."
          }
          Path("/tmp/distributed-observation.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Set up Python for Work Finder AI
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Work Finder AI in read-only mode
        run: |
          set -euo pipefail
          python -m scripts.work_finder_ai \
            --repo-root . \
            --catalog .github/autonomous-loop-task-catalog.json \
            --queue .github/autonomous-loop-tasks.json \
            --state /tmp/autonomous-loop-state.json \
            --runtime core/line_development_runtime.py \
            --existing-issues /tmp/autonomous-loop-all-issues.json \
            --output /tmp/work-finder-report.json \
            | tee /tmp/work-finder-summary.json
          python - <<'PY'
          import json
          from pathlib import Path

          observation_path = Path("/tmp/distributed-observation.json")
          observation = json.loads(observation_path.read_text(encoding="utf-8"))
          work_finder = json.loads(Path("/tmp/work-finder-report.json").read_text(encoding="utf-8"))
          observation["work_finder"] = work_finder.get("work_finder", {})
          observation["work_finder_status"] = work_finder.get("status")
          observation["work_finder_candidate_count"] = work_finder.get("candidate_count")
          observation_path.write_text(
              json.dumps(observation, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(observation["work_finder"], ensure_ascii=False, indent=2))
          PY
          cat /tmp/work-finder-report.json >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/distributed-observation.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload observation and Work Finder evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-observation-${{ github.run_id }}
          path: |
            /tmp/distributed-observation.json
            /tmp/work-finder-report.json
          if-no-files-found: warn
          retention-days: 30
