name: LOOP30 Minimal

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: loop30-minimal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  read-only-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python syntax without writing files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(Path("core").rglob("*.py"))
          if not files:
              raise SystemExit("BLOCKED: no Python files found under core/")
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"PASS: parsed {len(files)} Python files")
          PY

      - name: Report bounded read-only result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            echo "PASS: LOOP30 read-only syntax check succeeded."
          else
            echo "FAIL: LOOP30 read-only syntax check ended with status: $JOB_STATUS"
            exit 1
          fi
          echo "Scope: no dispatch, patch, merge, or deploy."
