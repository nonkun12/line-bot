name: REA Independent Test Collector

on:
  workflow_run:
    workflows: ["Distributed Autonomous Development Loop"]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: rea-independent-collector-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # This workflow_run workflow executes only its default-branch definition.
      # Never checkout or execute the source workflow's branch scripts.
      - name: Checkout trusted default-branch verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record source workflow outcome
        env:
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_CONCLUSION" = "success" ]; then
            exit 0
          fi
          mkdir -p independent-evidence
          if [ "$SOURCE_CONCLUSION" = "skipped" ]; then
            reason="source_workflow_skipped"
          else
            reason="source_workflow_not_success"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          reason = "source_workflow_skipped" if os.environ["SOURCE_CONCLUSION"] == "skipped" else "source_workflow_not_success"
          marker = {
              "schema_version": 1,
              "run_id": os.environ["SOURCE_RUN_ID"],
              "run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "outcome": "skipped",
              "reason_code": reason,
          }
          context = {
              "schema_version": 1,
              "collector_run_id": os.environ["GITHUB_RUN_ID"],
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_run_attempt": int(os.environ["SOURCE_RUN_ATTEMPT"]),
              "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "source_head_branch": os.environ["SOURCE_HEAD_BRANCH"],
              "expected_tasks": [],
          }
          Path("independent-evidence/rea-independent-test-evidence.jsonl").write_text(json.dumps(marker, sort_keys=True) + "\n")
          Path("independent-evidence/collector-context.json").write_text(json.dumps(context, sort_keys=True) + "\n")
          PY

      - name: Download exact source-run task artifact
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p source-evidence
          gh run download "$SOURCE_RUN_ID" --repo "$GH_REPOSITORY" \
            --name "minimal-autonomous-loop-$SOURCE_RUN_ID-attempt-$SOURCE_RUN_ATTEMPT" --dir source-evidence
          test -s source-evidence/minimal-autonomous-loop.jsonl

      - name: Verify provenance and independently test exact task commits
        if: github.event.workflow_run.conclusion == 'success'
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rea_independent_collector.py \
            --input source-evidence/minimal-autonomous-loop.jsonl \
            --output independent-evidence \
            --run-id "$SOURCE_RUN_ID" \
            --run-attempt "$SOURCE_RUN_ATTEMPT" \
            --source-head-sha "$SOURCE_HEAD_SHA" \
            --source-head-branch "$SOURCE_HEAD_BRANCH" \
            --default-branch "$DEFAULT_BRANCH"

      - name: Upload trusted independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-independent-evidence-${{ github.run_id }}
          path: independent-evidence/
          if-no-files-found: error
          retention-days: 14
