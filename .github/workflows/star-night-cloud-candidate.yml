name: Star Night Cloud Candidate

on:
  schedule:
    # Runs hourly after this workflow reaches the default branch.
    - cron: "0 14-23,0-13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: star-night-cloud-candidate
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify candidate contract
        run: |
          python -m pytest -q \
            tests/test_star_night_cloud_candidate.py \
            tests/test_audiovisual_critic.py

      - name: Install cloud rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-noto-cjk

      - name: Build cloud-native draft bundle
        run: |
          python -m scripts.build_star_night_cloud_candidate \
            --output-dir "artifacts/ci/star-night-${GITHUB_RUN_ID}" \
            --bpm 76 \
            --render-animatic

      - name: Preserve candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star-night-candidate-${{ github.run_id }}
          path: artifacts/ci/star-night-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14
