name: ORCA Free CPU Task Worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: orca-free-cpu-task-worker
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      task_id: ${{ steps.poll.outputs.task_id }}
      task_payload: ${{ steps.poll.outputs.task_payload }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Poll D1 task queue (read-only)
        id: poll
        env:
          ORCA_TASK_API_URL: https://orca-test-api.norimitsu50.workers.dev
          ORCA_TASK_API_TOKEN: ${{ secrets.ORCA_TASK_API_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/orca_free_cpu_worker.py poll

  execute:
    needs: poll
    if: ${{ needs.poll.outputs.task_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: orca-task-execution
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify protected execution environment is configured
        env:
          ORCA_TASK_APPROVAL_GATE: ${{ secrets.ORCA_TASK_APPROVAL_GATE }}
        run: |
          set -euo pipefail
          test -n "$ORCA_TASK_APPROVAL_GATE" || { echo "Required reviewer environment gate is not configured."; exit 1; }
      - name: Prepare isolated, network-disabled test container
        run: |
          set -euo pipefail
          docker run -d --name orca-cpu-test --network bridge --cpus=2 --memory=4g \
            --pids-limit=256 --security-opt=no-new-privileges \
            -e PYTHONDONTWRITEBYTECODE=1 -e PYTEST_ADDOPTS="-p no:cacheprovider" \
            -v "$GITHUB_WORKSPACE:/workspace" -v "$GITHUB_WORKSPACE/.git:/workspace/.git:ro" -w /workspace \
            python:3.13-slim sleep infinity
          docker exec orca-cpu-test python -m pip install --no-cache-dir pytest
          docker network disconnect bridge orca-cpu-test
      - name: Install Ollama CPU runtime
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 </dev/null &
          for attempt in $(seq 1 30); do
            if ollama list >/dev/null 2>&1; then break; fi
            sleep 2
          done
          ollama pull qwen2.5-coder:1.5b
      - name: Generate, test, and open a review-only PR
        env:
          ORCA_TASK_API_URL: https://orca-test-api.norimitsu50.workers.dev
          ORCA_TASK_API_TOKEN: ${{ secrets.ORCA_TASK_API_TOKEN }}
          ORCA_TASK_APPROVAL_GATE: ${{ secrets.ORCA_TASK_APPROVAL_GATE }}
          ORCA_TASK_PAYLOAD: ${{ needs.poll.outputs.task_payload }}
          ORCA_CPU_MODEL: qwen2.5-coder:1.5b
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/orca_free_cpu_worker.py process
