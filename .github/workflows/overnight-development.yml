name: Autonomous Development

on:
  schedule:
    - cron: "30 17 * * *" # 02:30 JST
    - cron: "30 0 * * *"  # 09:30 JST
    - cron: "30 6 * * *"  # 15:30 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-development
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run common guarded development runtime
        id: development
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEV_INSTRUCTION: "自律開発です。既存機能を壊さない範囲で、リポジトリ内の安全な小規模改善を1件だけ選定して実装してください。変更は1ファイルを基本とし、テスト可能な改善を優先し、必ずpytestとレビューゲートを通してください。mainへ直接変更せずPRを作成する前提です。"
          DEV_USER_ID: autonomous
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python -m core.line_development_runtime

      - name: Create GitHub PR
        id: create_pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: line-dev/${{ github.run_id }}
        run: |
          set -euo pipefail
          git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --head "${BRANCH}" \
            --base main \
            --title "chore: autonomous development" \
            --body "Autonomous development executed through the same guarded multi-agent runtime used by LINE /dev. PR is intentionally left for review; no automatic merge."

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OUTCOME: ${{ steps.create_pr.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL}" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping Slack notification."
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          outcome = os.environ.get("OUTCOME", "unknown")
          run_url = os.environ.get("RUN_URL", "")
          text = ("✅ 自律開発が完了しPRを作成しました。" if outcome == "success" else "❌ 自律開発が失敗しました。") + f"\n{run_url}"
          payload = json.dumps({"text": text}).encode("utf-8")
          request = urllib.request.Request(os.environ["SLACK_WEBHOOK_URL"], data=payload, headers={"Content-Type":"application/json"}, method="POST")
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"Slack notification HTTP {response.status}: {response.read().decode('utf-8', errors='replace')}")
          except Exception as exc:
              print(f"Slack notification failed: {type(exc).__name__}: {exc}")
          PY
