name: Autonomous Development Loop

on:
  workflow_dispatch:
  schedule:
    # Japan time: 03:00, 15:00, 21:00 every day.
    - cron: '0 3 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '0 15 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '0 21 * * *'
      timezone: 'Asia/Tokyo'

# Scheduled runs are intentionally on the default branch.
# Autonomous changes are pushed to a dedicated branch and reviewed via PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-development-loop
  cancel-in-progress: false

jobs:
  autonomous-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NIGHTLY_AUTOFIX: 'true'
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      DEV_INSTRUCTION: 'コントロールタワーAIの完成度を1段階上げてください。既存のAIGateway、AgentRegistry、Supervisor、Routerの責務分離を維持し、ユーザー要求をより安定して適切なAgentへ振り分けるための最小限の改善を実装してください。特に優先順位、未解決要求の安全なfallback、channel-independentなrequest metadataの活用を検討してください。既存のLINE/Voice機能を壊さず、新規依存関係や外部APIを追加しないでください。変更は最小限、テスト可能にしてください。'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "nightly-autonomous-worker"
          git config user.email "nightly-worker@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Record autonomous starting commit
        run: echo "AUTONOMOUS_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run one guarded control tower development task
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/nightly_task_worker.py

      - name: Run guarded autonomous self-healing check
        if: success()
        env:
          CHANNEL_ACCESS_TOKEN: ${{ secrets.CHANNEL_ACCESS_TOKEN }}
          CHANNEL_SECRET: ${{ secrets.CHANNEL_SECRET }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
        run: python scripts/nightly_worker.py

      - name: Validate autonomous result and Safety Gate
        if: success()
        run: |
          set -euo pipefail
          PRODUCED_SHA="$(git rev-parse HEAD)"
          CHANGED_FILES="$(git diff --name-only "$AUTONOMOUS_START_SHA" "$PRODUCED_SHA")"
          FILE_COUNT="$(printf '%s\n' "$CHANGED_FILES" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$FILE_COUNT" -gt 4 ]; then
            echo "Safety Gate blocked: too many changed files ($FILE_COUNT)."
            echo "AUTONOMOUS_SAFETY_GATE_RESULT=BLOCKED" >> "$GITHUB_ENV"
            echo "AUTONOMOUS_BLOCKED_FAILED_REASON=too_many_changed_files" >> "$GITHUB_ENV"
            exit 1
          fi
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/*|.env*|config.py|secrets/*)
                echo "Safety Gate blocked forbidden path: $path"
                echo "AUTONOMOUS_SAFETY_GATE_RESULT=BLOCKED" >> "$GITHUB_ENV"
                echo "AUTONOMOUS_BLOCKED_FAILED_REASON=forbidden_changed_file:$path" >> "$GITHUB_ENV"
                exit 1 ;;
              *.py|*.md|*.json|*.txt) ;;
              *)
                echo "Safety Gate blocked unsupported path: $path"
                echo "AUTONOMOUS_SAFETY_GATE_RESULT=BLOCKED" >> "$GITHUB_ENV"
                echo "AUTONOMOUS_BLOCKED_FAILED_REASON=unsupported_changed_file:$path" >> "$GITHUB_ENV"
                exit 1 ;;
            esac
          done <<< "$CHANGED_FILES"
          git diff --check "$AUTONOMOUS_START_SHA" "$PRODUCED_SHA"
          if [ ! -f nightly_worker_summary.json ]; then
            echo "Safety Gate blocked: missing worker summary."
            echo "AUTONOMOUS_SAFETY_GATE_RESULT=BLOCKED" >> "$GITHUB_ENV"
            echo "AUTONOMOUS_BLOCKED_FAILED_REASON=missing_worker_summary" >> "$GITHUB_ENV"
            exit 1
          fi
          python - <<'PY'
import json
from pathlib import Path
summary = json.loads(Path("nightly_worker_summary.json").read_text(encoding="utf-8"))
if summary.get("status") != "PASS":
    raise SystemExit(f"Safety Gate blocked: worker status={summary.get('status')!r}")
print("Safety Gate: PASS")
PY
          echo "AUTONOMOUS_SAFETY_GATE_RESULT=PASS" >> "$GITHUB_ENV"

      - name: Publish final autonomous branch and PR
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTONOMOUS_BRANCH: autonomous/loop-${{ github.run_id }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$AUTONOMOUS_START_SHA" ]; then
            echo 'No autonomous changes to publish.'
            echo "AUTONOMOUS_RESULT=no-changes" >> "$GITHUB_ENV"
            exit 0
          fi
          git push origin "HEAD:refs/heads/${AUTONOMOUS_BRANCH}"
          PR_URL="$(gh pr create \
            --base main \
            --head "${AUTONOMOUS_BRANCH}" \
            --title "chore: autonomous development loop ${{ github.run_id }}" \
            --body "Autonomous development result. Review, safety gates, and current-HEAD CI are required before merge. This workflow does not merge automatically.")"
          echo "AUTONOMOUS_RESULT=pr-created" >> "$GITHUB_ENV"
          echo "AUTONOMOUS_PR_URL=${PR_URL}" >> "$GITHUB_ENV"

      - name: Record autonomous development result to Google Sheets
        if: always()
        env:
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          AUTONOMOUS_DEV_LEDGER_RANGE: ${{ secrets.AUTONOMOUS_DEV_LEDGER_RANGE }}
        run: |
          set -euo pipefail
          export AUTONOMOUS_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export AUTONOMOUS_PRODUCED_SHA="$(git rev-parse HEAD)"
          export AUTONOMOUS_CHANGED_FILES="$(git diff --name-only "$AUTONOMOUS_START_SHA" "$AUTONOMOUS_PRODUCED_SHA" | paste -sd, -)"
          if [ -f nightly_worker_summary.json ]; then
            export AUTONOMOUS_TESTS_RESULT="$(python - <<'PY'
import json
from pathlib import Path
s=json.loads(Path("nightly_worker_summary.json").read_text(encoding="utf-8"))
print("PASS" if s.get("status")=="PASS" else "FAIL")
PY
)"
          else
            export AUTONOMOUS_TESTS_RESULT="NOT_RUN"
          fi
          export AUTONOMOUS_VERIFICATION_RESULT="NOT_RUN"
          export AUTONOMOUS_SAFETY_GATE_RESULT="${AUTONOMOUS_SAFETY_GATE_RESULT:-BLOCKED}"
          if [ "${AUTONOMOUS_RESULT:-}" = "pr-created" ] && [ "${AUTONOMOUS_SAFETY_GATE_RESULT}" = "PASS" ]; then
            export AUTONOMOUS_NEXT_ACTION="review_pr"
          elif [ "${AUTONOMOUS_RESULT:-}" = "no-changes" ]; then
            export AUTONOMOUS_NEXT_ACTION="next_scheduled_run"
          else
            export AUTONOMOUS_BLOCKED_FAILED_REASON="${AUTONOMOUS_BLOCKED_FAILED_REASON:-workflow_or_autonomous_task_failed}"
            export AUTONOMOUS_NEXT_ACTION="review_failure"
          fi
          python - <<'PY'
from agents.sheets.autonomous_ledger import record_autonomous_run
if not record_autonomous_run():
    print("Autonomous run already recorded; idempotent retry.")
else:
    print("Autonomous development result recorded to Google Sheets.")
PY

      - name: Notify Slack and LINE
        if: always()
        env:
          CHANNEL_ACCESS_TOKEN: ${{ secrets.CHANNEL_ACCESS_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINE_NOTIFY_USER_ID: ${{ secrets.LINE_NOTIFY_USER_ID }}
          RUN_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="🤖 自律開発ループ完了\n結果: ${RUN_STATUS}\n実行: ${RUN_URL}"
          if [ -n "${AUTONOMOUS_PR_URL:-}" ]; then
            MESSAGE="${MESSAGE}\nPR: ${AUTONOMOUS_PR_URL}"
          elif [ "${AUTONOMOUS_RESULT:-}" = "no-changes" ]; then
            MESSAGE="${MESSAGE}\n変更なし"
          fi
          export MESSAGE

          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            python - <<'PY'
import json, os, urllib.request
message = os.environ["MESSAGE"]
req = urllib.request.Request(
    os.environ["SLACK_WEBHOOK_URL"],
    data=json.dumps({"text": message}).encode(),
    headers={"Content-Type": "application/json"},
    method="POST",
)
with urllib.request.urlopen(req, timeout=15) as response:
    if response.status >= 300:
        raise SystemExit(f"Slack notification failed: HTTP {response.status}")
PY
          else
            echo "SLACK_WEBHOOK_URL is not configured; Slack notification skipped."
          fi

          if [ -n "${CHANNEL_ACCESS_TOKEN:-}" ] && [ -n "${LINE_NOTIFY_USER_ID:-}" ]; then
            python - <<'PY'
import json, os, urllib.request
payload = {
    "to": os.environ["LINE_NOTIFY_USER_ID"],
    "messages": [{"type": "text", "text": os.environ["MESSAGE"]}],
}
req = urllib.request.Request(
    "https://api.line.me/v2/bot/message/push",
    data=json.dumps(payload).encode(),
    headers={
        "Authorization": "Bearer " + os.environ["CHANNEL_ACCESS_TOKEN"],
        "Content-Type": "application/json",
    },
    method="POST",
)
with urllib.request.urlopen(req, timeout=15) as response:
    if response.status >= 300:
        raise SystemExit(f"LINE notification failed: HTTP {response.status}")
PY
          else
            echo "LINE notification secrets are not configured; LINE notification skipped."
          fi

      - name: Upload worker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-worker-summary-${{ github.run_id }}
          path: nightly_worker_summary.json
          if-no-files-found: ignore
