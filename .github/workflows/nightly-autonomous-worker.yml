name: Nightly Autonomous Worker

on:
  workflow_dispatch:
  schedule:
    # 03:30 JST
    - cron: '30 18 * * *'
    # 12:30 JST — daytime autonomous development pass
    - cron: '30 3 * * *'

# This workflow intentionally has no push trigger.
# A repair commit therefore cannot recursively invoke this worker.
permissions:
  contents: write

concurrency:
  group: nightly-autonomous-worker
  cancel-in-progress: false

jobs:
  autonomous-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "nightly-autonomous-worker"
          git config user.email "nightly-worker@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Record starting commit
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run guarded autonomous worker
        env:
          NIGHTLY_AUTOFIX: 'true'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AUTO_DEPLOY: 'false'
        run: python scripts/nightly_worker.py

      - name: Push verified repair commit
        if: success()
        run: |
          if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then
            echo 'No new repair commit to push.'
            exit 0
          fi
          git push origin HEAD:main

      - name: Upload worker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-worker-summary
          path: nightly_worker_summary.json
          if-no-files-found: ignore
