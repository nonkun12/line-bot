name: Daily Self-Improvement Loop

on:
  workflow_dispatch:
  schedule:
    # 03:00 JST every day (18:00 UTC)
    - cron: '0 18 * * *'

# This workflow intentionally has no push trigger.
# Autonomous changes are pushed to a dedicated branch and reviewed via PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-self-improvement-loop
  cancel-in-progress: false

jobs:
  autonomous-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL_ACCESS_TOKEN: ${{ secrets.CHANNEL_ACCESS_TOKEN }}
      CHANNEL_SECRET: ${{ secrets.CHANNEL_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      NIGHTLY_AUTOFIX: 'true'
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      DEV_INSTRUCTION: '毎日の自己改善ループを実行してください。現在のコード、既存テスト、直近の実行結果から改善余地を1件だけ特定し、原因または根拠を確認したうえで、最小限のテスト可能な改善を実装してください。既存機能を壊さず、秘密情報、認証、デプロイ設定、GitHub Actions、自己改善ポリシー自体は変更しないでください。新規依存関係や外部APIは追加せず、pytestを通過させてください。問題が見つからない場合は無理に変更せず、安全に終了してください。'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "nightly-autonomous-worker"
          git config user.email "nightly-worker@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Record autonomous starting commit
        run: echo "AUTONOMOUS_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run one bounded daily self-improvement task
        id: self_improvement
        run: python scripts/nightly_task_worker.py

      - name: Run read-only final verification
        id: verification
        if: success()
        env:
          NIGHTLY_AUTOFIX: 'false'
        run: python scripts/nightly_worker.py

      - name: Publish final autonomous branch and PR
        if: ${{ steps.self_improvement.outcome == 'success' && steps.verification.outcome == 'success' }}
        env:
          NIGHTLY_BRANCH: nightly/self-improvement-${{ github.run_id }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$AUTONOMOUS_START_SHA" ]; then
            echo 'No autonomous changes to publish.'
            exit 0
          fi
          git push origin "HEAD:refs/heads/${NIGHTLY_BRANCH}"
          gh pr create \
            --base main \
            --head "${NIGHTLY_BRANCH}" \
            --title "chore: daily self-improvement ${{ github.run_id }}" \
            --body "Daily self-improvement result. Review and CI are required before merge. This workflow does not merge or deploy automatically."

      - name: Upload worker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-worker-summary
          path: nightly_worker_summary.json
          if-no-files-found: ignore
