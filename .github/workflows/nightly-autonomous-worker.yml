name: Nightly Autonomous Worker

on:
  workflow_dispatch:
  schedule:
    # 03:00 JST every day (18:00 UTC)
    - cron: '0 18 * * *'

# This workflow intentionally has no push trigger.
# A repair commit therefore cannot recursively invoke this worker.
permissions:
  contents: write

concurrency:
  group: nightly-autonomous-worker
  cancel-in-progress: false

jobs:
  autonomous-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL_ACCESS_TOKEN: ${{ secrets.CHANNEL_ACCESS_TOKEN }}
      CHANNEL_SECRET: ${{ secrets.CHANNEL_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      NIGHTLY_AUTOFIX: 'true'
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "nightly-autonomous-worker"
          git config user.email "nightly-worker@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Record starting commit
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run guarded autonomous worker
        run: python scripts/nightly_worker.py

      - name: Push verified repair commit
        if: success()
        run: |
          if [ "$(git rev-parse HEAD)" = "$START_SHA" ]; then
            echo 'No new repair commit to push.'
            exit 0
          fi
          git push origin HEAD:main

      - name: Upload worker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-worker-summary
          path: nightly_worker_summary.json
          if-no-files-found: ignore
