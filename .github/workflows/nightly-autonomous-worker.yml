name: Nightly Autonomous Worker

on:
  workflow_dispatch:
  schedule:
    # 03:00 JST every day (18:00 UTC)
    - cron: '0 18 * * *'

# This workflow intentionally has no push trigger.
# Autonomous changes are pushed to a dedicated branch and reviewed via PR.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nightly-autonomous-worker
  cancel-in-progress: false

jobs:
  autonomous-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL_ACCESS_TOKEN: ${{ secrets.CHANNEL_ACCESS_TOKEN }}
      CHANNEL_SECRET: ${{ secrets.CHANNEL_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      NIGHTLY_AUTOFIX: 'true'
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      DEV_INSTRUCTION: 'コントロールタワーAIの完成度を1段階上げてください。既存のAIGateway、AgentRegistry、Supervisor、Routerの責務分離を維持し、ユーザー要求をより安定して適切なAgentへ振り分けるための最小限の改善を実装してください。特に優先順位、未解決要求の安全なfallback、channel-independentなrequest metadataの活用を検討してください。既存のLINE/Voice機能を壊さず、新規依存関係や外部APIを追加しないでください。変更は最小限、テスト可能にしてください。'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "nightly-autonomous-worker"
          git config user.email "nightly-worker@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Record autonomous starting commit
        run: echo "AUTONOMOUS_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run common guarded development runtime
        if: success()
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEV_INSTRUCTION: ${{ env.DEV_INSTRUCTION }}
          DEV_USER_ID: autonomous
          GITHUB_RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/run_guarded_runtime.py

      - name: Create PR from guarded development branch
        if: success()
        env:
          NIGHTLY_BRANCH: line-dev/${{ github.run_id }}
        run: |
          git ls-remote --exit-code origin "refs/heads/${NIGHTLY_BRANCH}" >/dev/null
          gh pr create \
            --base main \
            --head "${NIGHTLY_BRANCH}" \
            --title "chore: nightly autonomous development ${{ github.run_id }}" \
            --body "Nightly autonomous development executed through the common guarded runtime. Review and CI are required before merge. This workflow does not merge automatically."

      - name: Upload worker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-worker-summary
          path: nightly_worker_summary.json
          if-no-files-found: ignore
