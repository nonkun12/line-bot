name: Nightly Autonomous Worker

on:
  workflow_dispatch:
  schedule:
    # 03:00 JST every day (18:00 UTC)
    - cron: '0 18 * * *'

# This workflow intentionally has no push trigger.
# A repair/development commit therefore cannot recursively invoke this worker.
permissions:
  contents: write

concurrency:
  group: nightly-autonomous-worker
  cancel-in-progress: false

jobs:
  autonomous-development:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL_ACCESS_TOKEN: ${{ secrets.CHANNEL_ACCESS_TOKEN }}
      CHANNEL_SECRET: ${{ secrets.CHANNEL_SECRET }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
      MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
      INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      NIGHTLY_AUTOFIX: 'true'
      AUTO_APPLY_PATCH: 'false'
      AUTO_DEPLOY: 'false'
      DEV_INSTRUCTION: 'コントロールタワーAIの完成度を1段階上げてください。既存のAIGateway、AgentRegistry、Supervisor、Routerの責務分離を維持し、ユーザー要求をより安定して適切なAgentへ振り分けるための最小限の改善を実装してください。特に優先順位、未解決要求の安全なfallback、channel-independentなrequest metadataの活用を検討してください。既存のLINE/Voice機能を壊さず、新規依存関係や外部APIを追加しないでください。変更は最小限、テスト可能にしてください。'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "nightly-autonomous-worker"
          git config user.email "nightly-worker@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Record task starting commit
        run: echo "TASK_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run one guarded control tower development task
        run: python scripts/nightly_task_worker.py

      - name: Push successful development task
        if: success()
        run: |
          if [ "$(git rev-parse HEAD)" = "$TASK_START_SHA" ]; then
            echo 'No new development commit to push.'
            exit 0
          fi
          git push origin HEAD:main

      - name: Record self-healing starting commit
        run: echo "HEAL_START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run guarded autonomous self-healing check
        run: python scripts/nightly_worker.py

      - name: Push successful self-healing commit
        if: success()
        run: |
          if [ "$(git rev-parse HEAD)" = "$HEAL_START_SHA" ]; then
            echo 'No new self-healing commit to push.'
            exit 0
          fi
          git push origin HEAD:main

      - name: Upload worker summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-worker-summary
          path: nightly_worker_summary.json
          if-no-files-found: ignore
