name: Nightly Autonomous Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: nightly-autonomous-worker
  cancel-in-progress: false

jobs:
  nightly-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run conservative worker
        run: python scripts/nightly_worker.py
