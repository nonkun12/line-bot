name: Autonomous Development Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 11 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 17 * * *'
      timezone: 'Asia/Tokyo'
    - cron: '30 23 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Sheets dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-auth google-api-python-client

      - name: Check scheduled run and Sheets audit
        id: watchdog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          AUTONOMOUS_DEV_LEDGER_RANGE: ${{ secrets.AUTONOMOUS_DEV_LEDGER_RANGE || secrets.GOOGLE_SHEETS_AUDIT_RANGE || 'AutonomousDevelopment!A:ZZ' }}
          GOOGLE_SHEETS_AUDIT_RANGE: ${{ secrets.GOOGLE_SHEETS_AUDIT_RANGE }}
        run: |
          set +e
          PYTHONPATH=. python scripts/check_autonomous_loop_watchdog.py | tee watchdog_result.json
          RC=${PIPESTATUS[0]}
          echo "watchdog exit code=${RC}"
          {
            echo 'result<<EOF'
            cat watchdog_result.json
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          exit "${RC}"

      - name: Notify Slack and LINE on watchdog failure
        if: failure()
        continue-on-error: true
        env:
          INTERNAL_PUSH_KEY: ${{ secrets.INTERNAL_PUSH_KEY }}
          DISTRIBUTED_LOOP_LINE_USER_ID: ${{ secrets.DISTRIBUTED_LOOP_LINE_USER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WATCHDOG_RESULT: ${{ steps.watchdog.outputs.result }}
        run: |
          if ! curl --fail-with-body --silent --show-error --retry 2 --retry-delay 3 --retry-all-errors --max-time 30 \
            "https://line-bot-yvea.onrender.com/health"; then
            echo "LINE_RENDER_HEALTH=FAILED; attempting one authenticated push anyway."
          fi
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from scripts.send_internal_line_push import send_internal_line_push

          message = "⚠️ 自律開発Watchdog警告\n" + os.environ.get("WATCHDOG_RESULT", "watchdog failed")

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "").strip()
          if webhook:
              request = urllib.request.Request(
                  webhook,
                  data=json.dumps({"text": message}).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=15) as response:
                      print(f"SLACK_NOTIFICATION=HTTP_{response.status}")
              except Exception as exc:
                  print(f"SLACK_NOTIFICATION=ERROR_{type(exc).__name__}")

          result = send_internal_line_push(message)
          print(f"LINE_NOTIFICATION={'SUCCESS' if result.ok else 'FAILED'}")
          print(f"LINE_NOTIFICATION_HTTP={result.http_status if result.http_status is not None else 'NOT_SENT'}")
          if result.reason:
              print(f"LINE_NOTIFICATION_ERROR={result.reason}")
          if not result.ok:
              raise SystemExit(1)

      - name: Upload watchdog result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-watchdog-${{ github.run_id }}
          path: watchdog_result.json
          if-no-files-found: ignore
