name: Independent QA Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_protected_changes:
        description: "Explicitly approve changes to protected QA/control files"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  independent-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve base and head SHAs
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha || '' }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -z "$BASE_SHA" ]; then
            git fetch origin main
            BASE_SHA="$(git rev-parse origin/main)"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Run base test suite
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/qa-base "${{ steps.refs.outputs.base_sha }}"
          (cd /tmp/qa-base && pytest -q --junitxml="$GITHUB_WORKSPACE/base-junit.xml")

      - name: Run PR head test suite
        run: pytest -q --junitxml=head-junit.xml

      - name: Evaluate independent QA evidence
        shell: bash
        env:
          ALLOW_PROTECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_protected_changes }}
        run: |
          set -euo pipefail
          args=()
          if [ "$ALLOW_PROTECTED" = "true" ]; then args+=(--allow-protected); fi
          python scripts/independent_qa_gate.py \\
            --base-sha "${{ steps.refs.outputs.base_sha }}" \\
            --head-sha "${{ steps.refs.outputs.head_sha }}" \\
            --base-junit base-junit.xml \\
            --head-junit head-junit.xml \\
            --output qa.json "${args[@]}"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-qa-evidence
          path: |
            qa.json
            base-junit.xml
            head-junit.xml
          retention-days: 14
